<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egypt Chess Academy (ECA) — Full Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050507; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .font-display { font-family: 'Cinzel', serif; }
    .gold-gradient-text { background: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #997415 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-card { background: rgba(14, 14, 21, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65); }
    .gold-btn { background: linear-gradient(135deg, #f3d266 0%, #d4af37 100%); color: #050507; font-weight: 700; }
    .gold-btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Animated Gold Particles Background -->
  <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-zinc-900 border border-yellow-500 text-yellow-300 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold"></div>

  <!-- Parent Password Modal -->
  <div id="parentModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="gold-card rounded-2xl max-w-md w-full p-6">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-display font-bold text-lg text-yellow-400">🔒 خانة ولي الأمر السرية</h3>
        <button onclick="closeParentModal()" class="text-gray-400 hover:text-white">✕</button>
      </div>
      <p class="text-xs text-gray-400 mb-3">أدخل الباسورد الموحد لأولياء الأمور</p>
      <input id="parentPassInp" type="password" placeholder="••••••" class="w-full bg-black border border-yellow-500/40 rounded-xl px-4 py-2.5 text-sm text-white mb-3" />
      <div class="flex justify-end gap-2">
        <button onclick="closeParentModal()" class="px-4 py-2 rounded-xl text-xs bg-zinc-800 text-gray-300">إلغاء</button>
        <button onclick="confirmParentPass()" class="px-4 py-2 rounded-xl text-xs gold-btn">فتح الملاحظات 🔓</button>
      </div>
    </div>
  </div>

  <!-- Coach Quick Login Modal -->
  <div id="coachQuickModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="gold-card rounded-2xl max-w-sm w-full p-6">
      <h3 class="font-display font-bold text-lg text-yellow-400 mb-3">🔐 دخول المدرب السريع</h3>
      <input id="coachQuickInp" type="password" placeholder="أدخل كلمة سر المدرب" onkeydown="if(event.key==='Enter')confirmCoachQuick()" class="w-full bg-black border border-yellow-500/40 rounded-xl px-4 py-2.5 text-sm text-white mb-3" />
      <div class="flex justify-end gap-2">
        <button onclick="document.getElementById('coachQuickModal').classList.add('hidden')" class="px-4 py-2 rounded-xl text-xs bg-zinc-800 text-gray-300">إلغاء</button>
        <button onclick="confirmCoachQuick()" class="px-4 py-2 rounded-xl text-xs gold-btn">فتح 🔓</button>
      </div>
    </div>
  </div>

  <!-- Level Up Test Modal -->
  <div id="examModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="gold-card rounded-2xl max-w-lg w-full p-6">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-display font-bold text-lg text-yellow-400" id="examTitle">🏆 Level Promotion Test</h3>
        <button onclick="closeExamModal()" class="text-gray-400 hover:text-white">✕</button>
      </div>
      <div id="examBody"></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 gold-card border-b border-yellow-500/20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div onclick="goHomeRefresh()" class="flex items-center gap-3 cursor-pointer select-none">
        <div class="w-11 h-11 rounded-xl gold-btn flex items-center justify-center text-2xl shadow-lg">👑</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display font-extrabold text-lg md:text-xl gold-gradient-text">EGYPT CHESS ACADEMY</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">ECA</span>
          </div>
          <p class="text-[11px] text-gray-400">Training, Daily Puzzles & Student Follow-Up</p>
        </div>
      </div>

      <!-- Coach Search Bar in Header -->
      <div id="coachSearchBox" class="hidden flex-1 max-w-md mx-2">
        <div class="relative flex items-center">
          <input id="coachTopSearch" oninput="coachSearchStudent(this.value)" type="text" placeholder="🔍 Search student username..." class="w-full bg-black/90 border border-yellow-500/40 rounded-xl pl-3 pr-24 py-2 text-xs text-white" />
          <button onclick="switchTab('tracker')" class="absolute right-1.5 gold-btn text-[11px] px-2.5 py-1 rounded-lg">Follow Up</button>
        </div>
      </div>

      <button id="langBtn" onclick="toggleLang()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-yellow-500/40 text-yellow-300">EN</button>
      <div id="navButtons" class="flex items-center gap-2 flex-wrap"></div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="mainView" class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <!-- Fallback visible immediately -->
    <div class="gold-card rounded-2xl p-6 text-center text-yellow-300">جاري تحميل منصة Egypt Chess Academy...</div>
  </main>

            <button onclick="openParentModal('${stu.id}')" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-black border border-yellow-500/40 text-yellow-300">🔒 خانة ولي الأمر السرية</button>
          </div>

          ${unlockedStuId === stu.id ? `
            <div class="p-4 rounded-2xl bg-amber-950/40 border-2 border-yellow-500 flex justify-between items-center">
              <div>
                <div class="text-xs font-bold text-yellow-400">🔓 ملاحظة المدرب السرية لولي الأمر:</div>
                <p class="text-sm text-white mt-1">${stu.note}</p>
              </div>
              <button onclick="unlockedStuId=null; render();" class="text-xs px-3 py-1 rounded bg-zinc-800">إغلاق 🔒</button>
            </div>
          ` : ''}

          <div class="grid md:grid-cols-2 gap-6">
            <!-- 1. Daily Puzzle -->
            <div class="gold-card rounded-2xl p-6">
              <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-yellow-300">🧩 Daily Puzzle — Step ${stu.level}</span>
                <span class="text-xs text-gray-400">نسبة الدقة: <b class="text-yellow-300">${s.puzP}%</b></span>
              </div>
              <p class="text-sm text-white font-medium mb-4">${puz.q}</p>
              <div class="space-y-2">
                ${puz.opts.map((o, i) => {
                  const c = !done ? 'border-yellow-500/30 hover:border-yellow-400' : i === puz.ans ? 'border-emerald-500 bg-emerald-500/10' : (done.i === i ? 'border-red-500 bg-red-500/10' : 'border-zinc-800 opacity-50');
                  const m = done ? (i === puz.ans ? '✓' : (done.i === i ? '✗' : '')) : 'اختيار ←';
                  return `<button ${done ? 'disabled' : ''} onclick="solvePuzzle(${i},${puz.ans})" class="w-full text-left px-4 py-2.5 rounded-xl text-xs bg-black/80 border ${c} flex justify-between ${done ? 'cursor-not-allowed' : ''}"><span>${o}</span><span class="text-yellow-400">${m}</span></button>`;
                }).join('')}
                ${done ? `<p class="text-xs mt-2 ${done.ok ? 'text-emerald-300' : 'text-red-300'}">${done.ok ? '✅ أجبت إجابة صحيحة — اللغز مقفول' : '❌ أجبت إجابة خاطئة — اللغز مقفول ولا يمكن إعادته'}</p>` : ''}
              </div>
              <div class="mt-4 pt-3 border-t border-yellow-500/20 text-right">
                <a href="${puz.url}" target="_blank" class="text-xs text-yellow-300 hover:underline">فتح التمرين على Lichess ↗</a>
              </div>
            </div>

            <!-- 2. Next Lesson Up -->
            <div class="gold-card rounded-2xl p-6 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-3">
                  <span class="text-xs font-bold text-emerald-300">🎯 الدرس اللي عليه الدور (Next Lesson)</span>
                  <span class="text-xs text-gray-400">${s.attP}% مكتمل</span>
                </div>
                ${s.nextLesson ? `
                  <div onclick="switchTab('lessons')" class="cursor-pointer p-5 rounded-2xl bg-black/80 border border-yellow-500/40 hover:border-yellow-400 transition">
                    <div class="text-xs text-yellow-400">Lesson #${s.nextIdx + 1} • Step ${stu.level}</div>
                    <h3 class="font-display font-bold text-xl text-white mt-1 flex justify-between"><span>${s.nextLesson.t}</span><span>→</span></h3>
                    <p class="text-xs text-gray-400 mt-2">اضغط هنا للانتقال تلقائياً لصفحة دروس مستواك (Step ${stu.level} فقط).</p>
                  </div>
                ` : `
                  <div class="p-5 rounded-2xl bg-emerald-950/30 border border-emerald-500/40 text-center">
                    <h3 class="font-bold text-emerald-300">🏆 أتممت كل دروس Step ${stu.level}!</h3>
                  </div>
                `}
              </div>
              <div class="mt-4 pt-3 border-t border-yellow-500/20 flex justify-between items-center">
                <span class="text-xs text-gray-400">اختبار الترقية للمستوى التالي:</span>
                <button onclick="openExamModal(${stu.level})" class="px-4 py-2 rounded-xl text-xs gold-btn">📝 بدء اختبار Step ${stu.level}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function solvePuzzle(i, ans) {
      const u = currUser();
      u.puz = u.puz || { t: 0, c: 0 };
      u.puzDone = u.puzDone || {};
      if (u.puzDone[u.level]) return toast("اللغز مقفول بالفعل");
      u.puz.t++;
      u.puzDone[u.level] = { i, ok: i === ans };
      if (i === ans) { u.puz.c++; toast("✅ إجابة صحيحة! أحسنت يا بطل"); }
      else toast("❌ إجابة خاطئة — تم قفل اللغز");
      save(); render();
    }

    function renderCoachHome(c) {
      return `
        <div class="space-y-6">
          <div class="gold-card rounded-2xl p-6 flex flex-wrap justify-between items-center gap-4">
            <div>
              <span class="px-2.5 py-1 rounded-full text-xs gold-btn">👑 حساب المدرب</span>
              <h2 class="font-display font-bold text-2xl gold-gradient-text mt-2">Welcome, ${c.name}</h2>
              <p class="text-xs text-gray-400">يمكنك استعراض جميع الـ 6 Steps ومتابعة حضور وواجبات ومجموعات الطلاب.</p>
            </div>
            <div class="flex gap-2">
              <button onclick="switchTab('lessons')" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-black border border-yellow-500/40 text-yellow-300">📚 كل الدروس (Steps 1-6)</button>
              <button onclick="switchTab('tracker')" class="px-4 py-2.5 rounded-xl text-xs gold-btn">📋 متابعة الطلاب والجروبات</button>
            </div>
          </div>
          <div class="gold-card rounded-2xl p-6">
            <h3 class="font-display font-bold text-lg text-yellow-400 mb-4">🧩 Daily Puzzles for All Levels (Steps 1 – 6)</h3>
            <div class="grid md:grid-cols-3 gap-4">
              ${[1,2,3,4,5,6].map(l => `
                <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/25">
                  <div class="text-xs font-bold text-yellow-400">STEP ${l} PUZZLE</div>
                  <p class="text-xs text-gray-300 mt-1">${PUZZLES[l].q}</p>
                  <a href="${PUZZLES[l].url}" target="_blank" class="inline-block mt-2 text-xs text-yellow-300 hover:underline">Open Study ↗</a>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderLessonsView(u) {
      const list = u.role === "coach" ? STEPS : STEPS.filter(s => s.step === Number(u.level));
      return `
        <div class="space-y-4">
          <div class="gold-card rounded-2xl p-5">
            <h2 class="font-display font-bold text-xl gold-gradient-text">${u.role==='coach'?'جميع المستويات للمدرب (Steps 1 – 6)':'دروس مستواك الحالي فقط — Step '+u.level}</h2>
            <p class="text-xs text-gray-400 mt-1">${u.role==='coach'?'اضغط على أي Step لعرض قائمة دروسها تحت بعضها.':'ممنوع ظهور أي مستوى آخر غير مستواك الحالي.'}</p>
          </div>
          ${list.map(st => {
            const isOpen = u.role === "student" ? true : !!openSteps[st.step];
            return `
              <div class="gold-card rounded-2xl overflow-hidden">
                <button onclick="openSteps[${st.step}]=!openSteps[${st.step}]; render();" class="w-full px-6 py-4 flex justify-between items-center text-left hover:bg-yellow-500/5">
                  <div>
                    <h3 class="font-display font-bold text-lg text-yellow-300">${st.title} <span class="text-xs text-gray-400 font-sans">(${st.lessons.length} Lessons)</span></h3>
                    <p class="text-xs text-gray-400">${st.sub}</p>
                  </div>
                  <span class="text-yellow-400 text-xs font-bold">${isOpen ? '▲ إخفاء القائمة' : '▼ عرض الدروس'}</span>
                </button>
                ${isOpen ? `
                  <div class="divide-y divide-yellow-500/15 border-t border-yellow-500/20 bg-black/60">
                    ${st.lessons.length === 0 ? `<div class="p-5 text-xs text-gray-500 text-center">Coming Soon</div>` : st.lessons.map((les, idx) => `
                      <div class="px-6 py-3 flex flex-wrap justify-between items-center gap-2 hover:bg-yellow-500/5">
                        <a href="${les.l[0][1]}" target="_blank" class="text-sm font-semibold text-white hover:text-yellow-300">${idx + 1}.${les.t} ↗</a>
                        <div class="flex flex-wrap gap-2">
                          ${les.l.map(lk => `<a href="${lk[1]}" target="_blank" class="px-3 py-1 rounded-lg text-xs bg-zinc-900 border border-yellow-500/35 text-yellow-300 hover:bg-yellow-500 hover:text-black">${lk[0]} ↗</a>`).join('')}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function coachSearchStudent(val) { searchQ = val; go("tracker"); render(); }

    function renderTrackerView() {
      const students = db.users.filter(u => u.role === "student");
      const filtered = students.filter(s => (grpFilter === "ALL" || s.group === grpFilter) && (!searchQ || s.name.toLowerCase().includes(searchQ.toLowerCase()) || s.username.toLowerCase().includes(searchQ.toLowerCase())));
      const sel = students.find(s => s.id === selStuId) || filtered[0] || null;
      return `
        <div class="space-y-5">
          <div class="gold-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 class="font-display font-bold text-xl gold-gradient-text">📋 متابعة الطلاب والمجموعات</h2>
              <p class="text-xs text-gray-400">علم (✓) أمام الدرس الذي حضره الطالب والواجب الذي حله واكتب ملاحظة سرية لولي الأمر.</p>
            </div>
            <form onsubmit="addGroup(event)" class="flex gap-2">
              <input id="newGrpInp" placeholder="+ اسم جروب جديد..." class="bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-white" />
              <button class="px-3 py-1.5 rounded-xl text-xs gold-btn">إضافة جروب</button>
            </form>
          </div>

          <div class="flex flex-wrap gap-2">
            <button onclick="grpFilter='ALL'; render();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${grpFilter==='ALL'?'gold-btn':'bg-zinc-900 text-gray-300'}">كل الجروبات (${students.length})</button>
            ${db.groups.map(g => `<button onclick="grpFilter='${g}'; render();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${grpFilter===g?'gold-btn':'bg-zinc-900 text-gray-300 border border-yellow-500/20'}">👥 ${g}</button>`).join('')}
          </div>

          <div class="grid md:grid-cols-3 gap-6">
            <div class="gold-card rounded-2xl p-4 space-y-2">
              ${filtered.map(s => {
                const st = calcStats(s);
                return `
                  <div onclick="selStuId='${s.id}'; render();" class="cursor-pointer p-3 rounded-xl border ${sel && sel.id===s.id ? 'border-yellow-400 bg-yellow-500/15' : 'border-yellow-500/15 bg-black/70'}">
                    <div class="flex justify-between font-bold text-xs text-white"><span>${s.name} (@${s.username})</span><span class="text-yellow-300">Step ${s.level}</span></div>
                    <div class="text-[11px] text-gray-400 mt-1">حضر: ${st.attC}/${st.total} | الواجب: ${st.hwC}/${st.total}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="md:col-span-2 gold-card rounded-2xl p-5">
              ${!sel ? `<p class="text-xs text-gray-400">اختر طالباً</p>` : (() => {
                const st = calcStats(sel);
                return `
                  <div class="space-y-4">
                    <div class="flex flex-wrap justify-between items-center gap-2 border-b border-yellow-500/20 pb-3">
                      <div>
                        <h3 class="font-bold text-lg text-white">${sel.name} <span class="text-xs px-2 py-0.5 rounded border ${st.evalCls}">${st.evalText} (${st.overall}%)</span></h3>
                        <p class="text-xs text-gray-400">متبقي ${st.rem} درس لإنهاء Step ${sel.level}</p>
                      </div>
                      <button onclick="resetPuz('${sel.id}')" class="px-3 py-1.5 rounded-xl text-xs bg-zinc-900 border border-yellow-500/30 text-yellow-300">↺ إعادة فتح اللغز</button>
                      <select onchange="selLvl('${sel.id}', this.value)" class="bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-yellow-300">
                        ${[1,2,3,4,5,6].map(l => `<option value="${l}" ${Number(sel.level)===l?'selected':''}>Step ${l}</option>`).join('')}
                      </select>
                    </div>
                    <div class="flex gap-2">
                      <input id="noteInp" value="${sel.note||''}" class="flex-1 bg-black border border-yellow-500/30 rounded-xl px-3 py-2 text-xs text-white" placeholder="ملاحظة سرية لولي الأمر..." />
                      <button onclick="saveNote('${sel.id}')" class="px-4 py-2 rounded-xl text-xs gold-btn">حفظ لولي الأمر 🔒</button>
                    </div>
                    <div class="divide-y divide-yellow-500/15 border border-yellow-500/20 rounded-xl max-h-80 overflow-y-auto bg-black/60">
                      ${st.st.lessons.map((les, i) => {
                        const k = sel.level + "-" + i;
                        const a = !!(sel.att && sel.att[k]);
                        const h = !!(sel.hw && sel.hw[k]);
                        return `
                          <div class="px-4 py-2.5 flex justify-between items-center text-xs">
                            <span class="text-white font-medium">${i+1}. ${les.t}</span>
                            <div class="flex gap-4">
                              <label class="flex items-center gap-1 cursor-pointer ${a?'text-emerald-300 font-bold':'text-gray-400'}">
                                <input type="checkbox" ${a?'checked':''} onchange="togCheck('${sel.id}','${k}','att')" /> حضر
                              </label>
                              <label class="flex items-center gap-1 cursor-pointer ${h?'text-yellow-300 font-bold':'text-gray-400'}">
                                <input type="checkbox" ${h?'checked':''} onchange="togCheck('${sel.id}','${k}','hw')" /> الواجب
                              </label>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              })()}
            </div>
          </div>
        </div>
      `;
    }

    function resetPuz(id) { const s = db.users.find(u => u.id === id); if (s.puzDone) delete s.puzDone[s.level]; save(); render(); toast("تم إعادة فتح اللغز"); }
    function addGroup(e) { e.preventDefault(); const v = document.getElementById("newGrpInp").value.trim(); if (v) { db.groups.push(v); save(); render(); } }
    function togCheck(id, k, type) { const s = db.users.find(u => u.id === id); s[type] = s[type] || {}; s[type][k] = !s[type][k]; save(); render(); }
    function selLvl(id, l) { const s = db.users.find(u => u.id === id); s.level = Number(l); save(); render(); }
    function saveNote(id) { const s = db.users.find(u => u.id === id); s.note = document.getElementById("noteInp").value; save(); toast("✅ تم حفظ الملاحظة السرية لولي الأمر"); }

    function renderParentView() {
      const stu = db.users.find(u => u.role === "student" && (u.username.toLowerCase() === parentQ.trim().toLowerCase() || u.name.toLowerCase().includes(parentQ.trim().toLowerCase())));
      return `
        <div class="max-w-4xl mx-auto space-y-5">
          <div class="gold-card rounded-2xl p-6">
            <h2 class="font-display font-bold text-xl gold-gradient-text">👨‍👩‍👦 بوابة متابعة ولي الأمر (Parent Dashboard)</h2>
            <p class="text-xs text-gray-400 mt-1">ابحث بالـ Username الخاص بابنك (جرب: <b class="text-yellow-300">omar_chess</b> أو <b class="text-yellow-300">youssef_eca</b>)</p>
            <input id="parentSearchInp" value="${parentQ}" oninput="parentQ=this.value; render();" placeholder="اكتب يوزرنيم الطالب..." class="mt-3 w-full bg-black border border-yellow-500/40 rounded-xl px-4 py-2.5 text-sm text-white" />
          </div>
          ${!stu ? `<div class="gold-card rounded-2xl p-6 text-center text-xs text-gray-400">لا يوجد طالب بهذا الاسم. جرب كتابة omar_chess</div>` : (() => {
            const s = calcStats(stu);
            return `
              <div class="gold-card rounded-2xl p-6 space-y-5">
                <div class="flex flex-wrap justify-between items-center gap-4 border-b border-yellow-500/20 pb-4">
                  <div>
                    <span class="text-xs text-yellow-400 font-bold">STEP ${stu.level} •${stu.group}</span>
                    <h3 class="font-display font-bold text-2xl text-white">${stu.name} (@${stu.username})</h3>
                  </div>
                  <div class="px-5 py-3 rounded-2xl border ${s.evalCls}">
                    <div class="text-[11px]">التقييم التلقائي لمستوى الطالب</div>
                    <div class="text-lg font-extrabold">${s.evalText} (${s.overall}%)</div>
                  </div>
                </div>
                <div class="grid sm:grid-cols-3 gap-4 text-center">
                  <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/20">
                    <div class="text-xs text-gray-400">الدروس التي حضرها</div>
                    <div class="text-xl font-bold text-emerald-400 mt-1">${s.attC} /${s.total}</div>
                    <div class="text-[11px] text-gray-500">متبقي ${s.rem} دروس</div>
                  </div>
                  <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/20">
                    <div class="text-xs text-gray-400">الواجبات المكتملة</div>
                    <div class="text-xl font-bold text-yellow-400 mt-1">${s.hwC} / ${s.total} (${s.hwP}%)</div>
                  </div>
                  <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/20">
                    <div class="text-xs text-gray-400">دقة الألغاز اليومية</div>
                    <div class="text-xl font-bold text-sky-400 mt-1">${s.puzP}%</div>
                  </div>
                </div>
                <div class="p-4 rounded-xl bg-black/90 border border-yellow-500/40 flex justify-between items-center">
                  ${unlockedStuId === stu.id ? `<div><b class="text-xs text-yellow-400">🔓 ملاحظة المدرب السرية:</b><p class="text-sm text-white mt-1">${stu.note}</p></div>` : `
                    <span class="text-xs text-yellow-300">🔒 ملاحظات المدرب السرية لولي الأمر (محمية بباسورد موحد)</span>
                    <button onclick="openParentModal('${stu.id}')" class="px-4 py-2 rounded-xl text-xs gold-btn">فتح بالباسورد 🔑</button>
                  `}
                </div>
              </div>
            `;
          })()}
        </div>
      `;
    }

    function openCoachQuick() { document.getElementById("coachQuickInp").value = ""; document.getElementById("coachQuickModal").classList.remove("hidden"); document.getElementById("coachQuickInp").focus(); }
    function confirmCoachQuick() {
      if (document.getElementById("coachQuickInp").value !== COACH_QUICK_PASS) return toast("❌ كلمة السر غير صحيحة");
      const u = db.users.find(x => x.id === "c1" && x.role === "coach"); if (!u) return;
      document.getElementById("coachQuickModal").classList.add("hidden");
      db.currId = u.id; go("home"); save(); render(); toast("مرحباً بك " + u.name);
    }
    let pendingStuId = null;
    function openParentModal(id) { pendingStuId = id; document.getElementById("parentPassInp").value = ""; document.getElementById("parentModal").classList.remove("hidden"); }
    function closeParentModal() { document.getElementById("parentModal").classList.add("hidden"); }
    function confirmParentPass() {
      if (document.getElementById("parentPassInp").value.trim() === "ECA-PARENT") {
        unlockedStuId = pendingStuId; closeParentModal(); render(); toast("🔓 تم فتح ملاحظة ولي الأمر");
      } else toast("❌ باسورد غير صحيح");
    }

    function openExamModal(lvl) {
      document.getElementById("examModal").classList.remove("hidden");
      document.getElementById("examBody").innerHTML = `
        <p class="text-xs text-gray-300 mb-3">اختبار نهاية Step ${lvl}: هل أنت جاهز للترقية إلى Step ${lvl+1}؟</p>
        <button onclick="passExam()" class="w-full py-2.5 rounded-xl text-xs gold-btn">إتمام الاختبار بنجاح والترقية إلى Step ${lvl+1} 🚀</button>
      `;
    }
    function closeExamModal() { document.getElementById("examModal").classList.add("hidden"); }
    function passExam() {
      const u = currUser();
      if (u && u.role === "student") { u.level = Math.min(6, Number(u.level) + 1); save(); closeExamModal(); render(); toast("🎉 مبروك! تمت ترقيتك إلى Step " + u.level); }
    }

    // Background Animation
    const cv = document.getElementById("bgCanvas"), ctx = cv.getContext("2d");
    function rsz() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
    window.addEventListener("resize", rsz); rsz();
    const pts = Array.from({ length: 35 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.8 + 0.5, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 }));
    function anim() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      pts.forEach(p => {
        p.x = (p.x + p.vx + cv.width) % cv.width; p.y = (p.y + p.vy + cv.height) % cv.height;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = "rgba(212,175,55,0.3)"; ctx.fill();
      });
      requestAnimationFrame(anim);
    }
    anim();
    const h0 = (location.hash || "#home").slice(1);
    tab = ["home", "lessons", "tracker", "parent"].includes(h0) ? h0 : "home";
    history.replaceState({ tab }, "", "#" + tab);
    window.addEventListener("popstate", e => { tab = (e.state && e.state.tab) || "home"; render(); });
    const _oe = openExamModal; openExamModal = function (l) { _oe(l); applyLang(); };
    render();
  </script>
</body>
</html>
