                        eca: {
                            black: '#050507',
                            obsidian: '#0b0b0f',
                            card: '#111116',

    <style>
        body {
            background-color: #050507;
            color: #f4f1ea;
            overflow-x: hidden;
        }

        /* Ambient Gold Glow & Subtle Vignette */
        .gold-ambient-glow {
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.10) 0%, rgba(5, 5, 7, 0) 65%);
        }

        /* Metallic Gold Gradient Text */
        .text-gold-gradient {
            background: linear-gradient(135deg, #fff6d6 0%, #f3d266 35%, #d4af37 70%, #9e7c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Metallic Gold Button / Badge */
        .bg-gold-gradient {
            background: linear-gradient(135deg, #f3d266 0%, #d4af37 55%, #b38b22 100%);
        }

        /* Smooth Accordion Vertical Collapse/Expand */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            opacity: 0;
        }
        .accordion-content.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .accordion-inner {
            overflow: hidden;
        }

        /* Lesson Vertical Row Hover Effect */
        .lesson-row {
            transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .lesson-row:hover {
            background-color: rgba(212, 175, 55, 0.06);
        }

        /* Custom Gold & Black Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050507;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b2414;
            border-radius: 9999px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }

        .refresh-spin {
            animation: spin 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-[#d4af37] selection:text-black relative">

    <!-- EYE-FRIENDLY AMBIENT BLACK & GOLD ANIMATED CANVAS BACKGROUND          -->

                    <span class="absolute -bottom-1 -right-1 px-1.5 py-0.2 bg-black text-[#f3d266] font-mono text-[10px] font-bold rounded-md border border-[#d4af37]/60 shadow">
                        ECA
                    </span>
                </div>
                <div>
                    <div class="flex items-center gap-2.5">
                        <span class="font-display font-extrabold text-lg sm:text-2xl tracking-wider text-gold-gradient">
                            Egypt Chess Academy
                        </span>
                        <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#d4af37]/15 text-[#f3d266] border border-[#d4af37]/40">
                            ECA
                        </span>
                    </div>
                    <p class="text-xs text-neutral-400 flex items-center gap-1.5 mt-0.5">
                        <i class="fa-solid fa-chess-king text-[10px] text-[#d4af37]"></i>
                        <span>Coaches Training Portal • Click logo to refresh</span>
                    </p>
                </div>
            </button>

                    <span id="header-stats-text">6 Steps • 56 Lessons</span>

                    classes: 'bg-[#d4af37]/20 hover:bg-[#d4af37] text-[#f3d266] hover:text-black border-[#d4af37]/50',

                return {

                    icon: 'fa-book-open'
                };

            if (lower.includes('exercise') || lower === '1-' || lower === '2-') {
                return {
                    classes: 'bg-[#d4af37]/15 hover:bg-[#f3d266] text-amber-300 hover:text-black border-amber-500/40',
                    icon: 'fa-dumbbell'
                };

            return {

                    const matchTitle = lesson.title.toLowerCase().includes(query);

                    if (activeLinkTypeFilter === 'examples') {

                    if (activeLinkTypeFilter === 'exercises') {

        /***********************************************************************
         * USER INTERACTION FUNCTIONS
         ***********************************************************************/
        // Toggle individual Step list open/closed on click
        function toggleStepAccordion(stepId) {
            if (openStepsSet.has(stepId)) {
                openStepsSet.delete(stepId);
            } else {
                openStepsSet.add(stepId);
            }
            renderVerticalStepLists();
        }

        // Open or close all Step lists at once
        function expandAllSteps(openAll) {
            if (openAll) {
                STEPS_DATA.forEach(s => openStepsSet.add(s.id));
            } else {
                openStepsSet.clear();
            }
            renderVerticalStepLists();
        }

        // Filter or open a specific Step via top quick pills
        function filterByStepPill(stepId) {
            activeQuickStep = stepId;
            if (stepId !== 'all') {
                openStepsSet.add(stepId);
            }
            renderQuickPills();
            renderVerticalStepLists();
        }

        function setLinkFilter(filterType) {
            activeLinkTypeFilter = filterType;
            document.querySelectorAll('.type-filter-btn').forEach(btn => {
                const isCurrent = btn.getAttribute('data-filter') === filterType;
                if (isCurrent) {
                    btn.className = 'type-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-gold-gradient text-black shadow-sm flex items-center gap-1.5';
                } else {
                    btn.className = 'type-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-neutral-400 hover:text-white transition-all flex items-center gap-1.5';
                }
            });
            renderVerticalStepLists();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            searchQuery = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderVerticalStepLists();

        // Clicking Egypt Chess Academy (ECA) Logo refreshes & resets to default state
        function resetToHome() {
            const icon = document.getElementById('brand-knight-icon');
            icon.classList.remove('refresh-spin');
            void icon.offsetWidth;
            icon.classList.add('refresh-spin');

            activeQuickStep = 'all';
            searchQuery = '';
            activeLinkTypeFilter = 'all';
            openStepsSet = new Set(['step-1']);

            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');

            setLinkFilter('all');
            renderQuickPills();
            renderVerticalStepLists();

            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('Egypt Chess Academy Portal Refreshed', 'fa-chess-knight');
        }

        // Copy Link to Clipboard
        function copyToClipboard(url, labelText) {
            const tempInput = document.createElement('textarea');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`Copied: ${labelText}`, 'fa-check');
            } catch (err) {
                showToast('Could not copy link', 'fa-triangle-exclamation');
            }
            document.body.removeChild(tempInput);
        }

        function showToast(message, iconClass = 'fa-check') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-gold-gradient text-black text-xs font-bold shadow-2xl border border-[#fff6d6]/50 transition-all duration-300 transform translate-y-2 opacity-0';
            toast.innerHTML = `
                <i class="fa-solid ${iconClass}"></i>
                <span>${escapeHtml(message)}</span>
            `;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2400);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        function escapeJsString(str) {
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // Search Bar Listeners
        document.getElementById('search-input').addEventListener('input', function (e) {
            searchQuery = e.target.value;
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderVerticalStepLists();
        });

        window.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== document.getElementById('search-input')) {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });

        /***********************************************************************
         * ✨ EYE-FRIENDLY AMBIENT BLACK & GOLD BACKGROUND ANIMATION (CANVAS)
         * Smooth floating golden dust particles + subtle constellation lines
         * + faint geometric chess grid pulse
         ***********************************************************************/
        let animRunning = true;
        const canvas = document.getElementById('ambient-bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let timeTick = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            const count = Math.min(55, Math.floor((canvas.width * canvas.height) / 24000));
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.8 + 0.6,
                    vx: (Math.random() - 0.5) * 0.22,
                    vy: (Math.random() - 0.5) * 0.22 - 0.08, // gentle upward drift
                    alpha: Math.random() * 0.45 + 0.15,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawAmbientBackground() {
            if (!animRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            timeTick += 0.008;

            // 1. Subtle Perspective Chess Grid Pulse in the background
            const gridSize = 90;
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.028)';
            ctx.lineWidth = 1;
            const offsetX = (timeTick * 12) % gridSize;
            const offsetY = (timeTick * 8) % gridSize;

            for (let x = offsetX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = offsetY; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 2. Update & Draw Soft Golden Particles
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                const twinkle = 0.65 + 0.35 * Math.sin(timeTick * 2 + p.phase);
                const currentAlpha = p.alpha * twinkle;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(243, 210, 102, ${currentAlpha})`;
                ctx.fill();

                // Subtle connecting golden threads between nearby particles
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        const lineAlpha = (1 - dist / 130) * 0.08;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(212, 175, 55, ${lineAlpha})`;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawAmbientBackground);
        }

        function toggleBackgroundAnimation() {
            animRunning = !animRunning;
            const icon = document.getElementById('anim-toggle-icon');
            if (animRunning) {
                icon.className = 'fa-solid fa-sparkles text-sm text-[#f3d266]';
                drawAmbientBackground();
                showToast('Background Animation Enabled', 'fa-play');
            } else {
                icon.className = 'fa-solid fa-pause text-sm text-neutral-500';
                showToast('Background Animation Paused', 'fa-pause');
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Initialize Portal on Load
        window.onload = function () {
            resizeCanvas();
            drawAmbientBackground();
            renderQuickPills();
            renderVerticalStepLists();
        };
    </script>
</body>
</html>
