<!DOCTYPE html>
<html lang="en" class="dark">

  <meta name="theme-color" content="#050507" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ECA Chess" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>(function(){try{var t=localStorage.getItem("ECA_THEME")==="light"?"light":"dark";var d=document.documentElement;d.classList.remove("dark","light");d.classList.add(t);}catch(e){}})();</script>
  <title>Egypt Chess Academy (ECA) — Full Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050507; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .font-display { font-family: 'Cinzel', serif; }
    .gold-gradient-text { background: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #997415 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-card { background: rgba(14, 14, 21, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65); }
    .gold-btn { background: linear-gradient(135deg, #f3d266 0%, #d4af37 100%); color: #050507; font-weight: 700; }
    .gold-btn:hover { filter: brightness(1.08); }

    /* ===== ECA additions: mobile, attendance, light theme ===== */
    body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
    header.sticky { padding-top: env(safe-area-inset-top); }
    @media (max-width: 640px) {
      #navButtons { width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
      #navButtons > button { white-space: nowrap; flex: 0 0 auto; }
      input, select, textarea { font-size: 16px !important; }
    }
    .att-btn { min-height: 42px; min-width: 66px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #18181b; color: #d1d5db; border: 1px solid rgba(212,175,55,.25); }
    .att-p.on { background: #10b981 !important; color: #04170f !important; border-color: #10b981 !important; }
    .att-l.on { background: #f59e0b !important; color: #1a1000 !important; border-color: #f59e0b !important; }
    .att-a.on { background: #ef4444 !important; color: #ffffff !important; border-color: #ef4444 !important; }
    .tap { min-height: 40px; }
    html.light body { background-color: #f6f3ea; color: #1f2937; }
    html.light #bgCanvas { opacity: .6; }
    html.light .gold-card { background: rgba(255,255,255,.94); border-color: rgba(153,116,21,.35); box-shadow: 0 6px 22px rgba(60,45,10,.12); }
    html.light .gold-gradient-text { background: linear-gradient(135deg,#7a5a07 0%,#b8860b 50%,#6b4f0a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    html.light [class*="bg-black"] { background-color: #ffffff !important; }
    html.light .fixed.inset-0[class*="bg-black"] { background-color: rgba(20,15,5,.55) !important; }
    html.light .bg-zinc-900 { background-color: #efe9d8 !important; }
    html.light .bg-zinc-800 { background-color: #e3dabf !important; }
    html.light .border-zinc-800 { border-color: #d9cfae !important; }
    html.light .text-white { color: #111827 !important; }
    html.light .text-gray-300 { color: #374151 !important; }
    html.light .text-gray-400 { color: #4b5563 !important; }
    html.light .text-gray-500 { color: #6b7280 !important; }
    html.light .text-yellow-300, html.light .text-yellow-400 { color: #7a5a07 !important; }
    html.light .text-emerald-300, html.light .text-emerald-400 { color: #047857 !important; }
    html.light .text-amber-300 { color: #b45309 !important; }
    html.light .text-red-300 { color: #b91c1c !important; }
    html.light .text-sky-400 { color: #0369a1 !important; }
    html.light .bg-emerald-950\/30 { background-color: #ecfdf5 !important; }
    html.light .bg-amber-950\/40 { background-color: #fffbeb !important; }
    html.light .att-btn { background: #efe9d8; color: #374151; }
    html.light .gold-btn, html.light .gold-btn * { color: #050507 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Animated Gold Particles Background -->
  <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-zinc-900 border border-yellow-500 text-yellow-300 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold"></div>

  <!-- Level Up Test Modal -->
  <div id="examModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="gold-card rounded-2xl max-w-lg w-full p-6">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-display font-bold text-lg text-yellow-400" id="examTitle">🏆 Level Promotion Test</h3>
        <button onclick="closeExamModal()" class="text-gray-400 hover:text-white">✕</button>
      </div>
      <div id="examBody"></div>
    </div>
  </div>


  <!-- Add / Edit Student Modal -->
  <div id="addStuModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <form onsubmit="saveStudent(event)" class="gold-card rounded-2xl max-w-lg w-full p-5 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-yellow-400">
          <span id="asTitleNew">➕ إضافة طالب جديد</span><span id="asTitleEdit" class="hidden">✏️ تعديل بيانات الطالب</span>
        </h3>
        <button type="button" onclick="closeAddStu()" class="text-gray-400 hover:text-white tap px-2">✕</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <input id="asName" required placeholder="اسم الطالب بالكامل" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asUser" placeholder="اليوزر نيم بالإنجليزي (اختياري)" autocapitalize="none" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asPass" placeholder="كلمة السر (6+ حروف) — سيبها فاضية لتوليد تلقائي" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asAge" type="number" min="3" max="99" inputmode="numeric" placeholder="السن" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asPhone" type="tel" inputmode="tel" placeholder="موبايل الطالب" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asParent" type="tel" inputmode="tel" placeholder="موبايل ولي الأمر (واتساب)" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <select id="asLevel" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300"></select>
        <select id="asGroup" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300"></select>
        <select id="asMode" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300">
          <option value="offline">🏫 طالب أوفلاين (حضوري)</option>
          <option value="online">💻 طالب أونلاين</option>
        </select>
      </div>
      <p id="asEditHint" class="hidden text-[11px] text-gray-400 mt-2">اترك الباسورد فارغاً لو مش عايز تغيّره.</p>
      <div class="flex flex-wrap justify-between items-center gap-2 mt-4">
        <button id="asDelBtn" type="button" onclick="deleteStudent()" class="hidden tap px-4 rounded-xl text-xs bg-red-500/20 text-red-300 border border-red-500/30">🗑️ حذف الطالب</button>
        <div class="flex gap-2 mr-auto">
          <button type="button" onclick="closeAddStu()" class="tap px-4 rounded-xl text-xs bg-zinc-800 text-gray-300">إلغاء</button>
          <button class="tap px-5 rounded-xl text-xs gold-btn"><span id="asSubNew">إضافة الطالب ✅</span><span id="asSubEdit" class="hidden">حفظ التعديلات ✅</span></button>
        </div>
      </div>
    </form>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 gold-card border-b border-yellow-500/20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div onclick="goHomeRefresh()" class="flex items-center gap-3 cursor-pointer select-none">
        <div class="w-11 h-11 rounded-xl bg-black border-2 border-yellow-500 flex flex-col items-center justify-center shadow-lg leading-none"><span class="font-display font-extrabold text-xs text-yellow-400 tracking-wider">ECA</span><span class="font-display text-[8px] text-yellow-200/80">CHESS</span></div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display font-extrabold text-lg md:text-xl gold-gradient-text">EGYPT CHESS ACADEMY</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">ECA</span>
          </div>
          <p class="text-[11px] text-gray-400">Training, Daily Puzzles & Student Follow-Up</p>
        </div>
      </div>

      <!-- Coach Search Bar in Header -->
      <div id="coachSearchBox" class="hidden flex-1 max-w-md mx-2">
        <div class="relative flex items-center">
          <input id="coachTopSearch" oninput="coachSearchStudent(this.value)" type="text" placeholder="🔍 Search student username..." class="w-full bg-black/90 border border-yellow-500/40 rounded-xl pl-3 pr-24 py-2 text-xs text-white" />
          <button onclick="switchTab('tracker')" class="absolute right-1.5 gold-btn text-[11px] px-2.5 py-1 rounded-lg">Follow Up</button>
        </div>
      </div>

      <button id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-yellow-500/40 text-yellow-300">☀️</button>
      <button id="installBtn" onclick="installApp()" class="hidden px-3 py-1.5 rounded-xl text-xs font-bold gold-btn">📲 تثبيت التطبيق</button>
      <button id="langBtn" onclick="toggleLang()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-yellow-500/40 text-yellow-300">EN</button>
      <div id="navButtons" class="flex items-center gap-2 flex-wrap"></div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="mainView" class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <!-- Fallback visible immediately -->
    <div class="gold-card rounded-2xl p-6 text-center text-yellow-300">جاري تحميل منصة Egypt Chess Academy...</div>
  </main>

    function randomPass() {
      const al = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const r = crypto.getRandomValues(new Uint8Array(8)); let s = "";
      for (const b of r) s += al[b % al.length];
      return s;
    }
    async function doLogin(ev) {
      ev.preventDefault();
      if (!window.fbLogin) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش، جرّب بعد ثواني");
      const q = document.getElementById("lEmail").value.trim();
      const p = document.getElementById("lPass").value;
      const btn = ev.submitter; if (btn) btn.disabled = true;
      const r = await window.fbLogin(q, p);
      if (btn) btn.disabled = false;
      if (!r.ok) return toast(r.code === "auth/too-many-requests" ? "⏳ محاولات كتير، استنى شوية وجرّب تاني" : (r.code === "auth/network-request-failed" ? "📡 مفيش اتصال بالإنترنت" : "❌ اسم المستخدم أو كلمة السر غير صحيحة"));
      parentStu = null; tab = "home";
    }
    async function doSignup(ev) {
      ev.preventDefault();
      if (!ALLOW_SELF_SIGNUP) return;
      if (!window.fbSignup) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش، جرّب بعد ثواني");
      const clean = s => String(s || "").trim().replace(/[<>"'`]/g, "");
      const name = clean(document.getElementById("sName").value);
      const username = clean(document.getElementById("sUser").value).toLowerCase().replace(/\s+/g, "_");
      const email = clean(document.getElementById("sEmail").value).toLowerCase();
      const pass = document.getElementById("sPass").value;
      if (signupRole === "coach") {
        if (!window.fbCoachSignup) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش، جرّب بعد ثواني");
        const code = document.getElementById("sCode").value.trim();
        if (!name || !email) return toast("❌ اكتب الاسم والإيميل");
        if (pass.length < 6) return toast("❌ كلمة السر لازم تكون 6 حروف على الأقل");
        const b2 = ev.submitter; if (b2) b2.disabled = true;
        const rc = await window.fbCoachSignup({ name, username: username || email.split("@")[0].replace(/[^a-z0-9_]/g, ""), email, pass, code });
        if (b2) b2.disabled = false;
        if (!rc.ok) return toast(rc.code === "auth/email-already-in-use" ? "❌ الإيميل ده مسجّل قبل كده" : (rc.code === "auth/weak-password" ? "❌ كلمة السر ضعيفة" : (rc.code === "bad-invite" || rc.code === "permission-denied" || rc.code === "not-found" ? "❌ كود الدعوة غير صحيح أو مستخدم قبل كده" : "❌ تعذّر إنشاء حساب الكوتش")));
        signupRole = "student"; tab = "home"; return toast("✅ تم إنشاء حساب الكوتش!");
      }
      const level = Number(document.getElementById("sLvl").value) || 1;
      if (!name || !username) return toast("❌ اكتب الاسم واسم المستخدم");
      if (pass.length < 6) return toast("❌ كلمة السر لازم تكون 6 حروف على الأقل");
      const btn = ev.submitter; if (btn) btn.disabled = true;
      const r = await window.fbSignup({ name, username, email, pass, level });
      if (btn) btn.disabled = false;
      if (!r.ok) return toast(r.code === "auth/email-already-in-use" ? "❌ اسم المستخدم ده مستخدم قبل كده" : (r.code === "auth/weak-password" ? "❌ كلمة السر ضعيفة" : "❌ تعذّر إنشاء الحساب"));
      tab = "home"; toast("✅ تم إنشاء حسابك!");
    }

    function solvePuzzle(i, ans) {
      const u = currUser();

      u.puzDone[u.level] = { i, ok: i === ans };
      if (i === ans) { u.puz.c++; toast("✅ إجابة صحيحة! أحسنت يا بطل"); }

    }

    function resetPuz(id) { const s = db.users.find(u => u.id === id); if (s.puzDone) delete s.puzDone[s.level]; save(); render(); toast("تم إعادة فتح اللغز"); }

                  </div>
                </div>
                <div class="grid sm:grid-cols-3 gap-4 text-center">
                  <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/20">

    async function parentLookup() {
      if (parentBusy) return;
      const code = String(parentQ || "").trim();
      if (!code) return toast("❌ اكتب كود المتابعة الأول");
      if (!window.fbParentLookup) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش، جرّب بعد ثواني");
      parentBusy = true;
      const r = await window.fbParentLookup(code);
      parentBusy = false;
      if (!r.ok) { parentStu = null; render(); return toast("❌ الكود غير صحيح أو انتهت صلاحيته"); }
      parentStu = r.stu; render();
    }
    async function genParentCode(id) {
      if (!window.fbGenParentCode) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش");
      const s = db.users.find(u => u.id === id);
      if (s && s.parentCode && !confirm(trText("تجديد الكود هيلغي الكود القديم وأي جهاز مربوط بيه. متأكد؟"))) return;
      const c = await window.fbGenParentCode(id);
      render(); toast(c ? "✅ تم إنشاء كود ولي الأمر" : "❌ تعذّر إنشاء الكود");
    }
    async function changeMyPassword() {
      if (!window.fbChangePassword) return;

      const n = prompt(trText("كلمة السر الجديدة (6 حروف على الأقل)")); if (n == null) return;
      if (n.length < 6) return toast("❌ كلمة السر لازم تكون 6 حروف على الأقل");
      const r = await window.fbChangePassword(o, n);
      toast(r.ok ? "✅ تم تغيير كلمة السر" : "❌ كلمة السر الحالية غير صحيحة");

        <button onclick="migrateLegacy()" class="px-3 py-2 rounded-xl bg-zinc-900 border border-yellow-500/40 text-yellow-300">ترحيل الطلاب من النظام القديم</button>
        <span class="text-gray-400">مرة واحدة: بينشئ حساب دخول لكل طالب وينزّل ملف فيه كلمات السر المؤقتة.</span>
        <button onclick="createInvite()" class="px-3 py-2 rounded-xl bg-zinc-900 border border-yellow-500/40 text-yellow-300">🎟️ كود دعوة كوتش جديد</button>
      </div>`;
    }
    async function createInvite() {
      if (!window.fbCreateInvite) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش");
      const c = await window.fbCreateInvite();
      if (!c) return toast("❌ تعذّر إنشاء الكود");

    async function migrateLegacy() {
      if (!window.fbMigrateLegacy) return toast("⚠️ الاتصال بالسيرفر لسه ما كملش");
      if (!confirm(trText("هيتم إنشاء حساب دخول لكل طالب قديم وتنزيل ملف كلمات السر المؤقتة. كمّل؟"))) return;
      toast("⏳ جاري الترحيل... ماتقفلش الصفحة");

    function openExamModal(lvl) {
      document.getElementById("examModal").classList.remove("hidden");
      document.getElementById("examBody").innerHTML = `
        <p class="text-xs text-gray-300 mb-3">اختبار نهاية Step ${lvl}: هل أنت جاهز للترقية إلى Step ${lvl+1}؟</p>
        <button onclick="passExam()" class="w-full py-2.5 rounded-xl text-xs gold-btn">إتمام الاختبار بنجاح والترقية إلى Step ${lvl+1} 🚀</button>
      `;
    }
    function closeExamModal() { document.getElementById("examModal").classList.add("hidden"); }
    function passExam() {
      const u = currUser();
      if (u && u.role === "student") { u.level = Math.min(6, Number(u.level) + 1); save(); closeExamModal(); render(); toast("🎉 مبروك! تمت ترقيتك إلى Step " + u.level); }
    }

    // ================= ECA ADDITIONS: students, attendance, backup, theme, PWA =================
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    function stuMode(s) { return s.mode === "online" ? "online" : "offline"; }
    function isCoach() { const u = currUser(); return !!(u && u.role === "coach"); }
    function waLink(num) { let d = String(num || "").replace(/\D/g, ""); if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "20" + d.slice(1); return "https://wa.me/" + d; }
    function dl(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
    function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

    // ---------- Attendance ----------
    let attDate = todayISO(), attMode = "offline", attQ = "", attMonth = todayISO().slice(0, 7);
    const ATT_LABEL = { p: "حاضر", l: "متأخر", a: "غايب" };
    function stuAttStats(id, month) {
      let p = 0, l = 0, a = 0;
      for (const d in db.attendance) {
        if (month && !d.startsWith(month)) continue;
        const v = db.attendance[d][id];
        if (v === "p") p++; else if (v === "l") l++; else if (v === "a") a++;
      }
      const t = p + l + a;
      return { p, l, a, t, rate: t ? Math.round(((p + l) / t) * 100) : null };
    }
    function setAtt(id, st) {
      if (!isCoach()) return;
      const r = db.attendance[attDate] = db.attendance[attDate] || {};
      if (r[id] === st) delete r[id]; else r[id] = st;
      if (!Object.keys(r).length) delete db.attendance[attDate];
      save(); keepScroll(render);
    }
    function markAll(st) {
      if (!isCoach()) return;
      const r = db.attendance[attDate] = db.attendance[attDate] || {};
      db.users.filter(u => u.role === "student" && stuMode(u) === attMode).forEach(s => { if (st) r[s.id] = st; else delete r[s.id]; });
      if (!Object.keys(r).length) delete db.attendance[attDate];
      save(); keepScroll(render);
    }
    function shiftDate(n) {
      const d = new Date(attDate + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
      attDate = d.toISOString().slice(0, 10); render();
    }
    function setAttDate(v) { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { attDate = v; render(); } }
    function setStuMode(id, m) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === id); if (!s) return;
      s.mode = m; save(); keepScroll(render);
      toast(m === "online" ? "💻 تم نقل الطالب إلى الأونلاين" : "🏫 تم نقل الطالب إلى الأوفلاين");
    }
    function renderAttendanceView() {
      const all = db.users.filter(u => u.role === "student");
      const inMode = all.filter(s => stuMode(s) === attMode);
      const q = attQ.toLowerCase();
      const list = inMode.filter(s => !q || s.name.toLowerCase().includes(q) || s.username.toLowerCase().includes(q));
      const rec = db.attendance[attDate] || {};
      const cnt = { p: 0, l: 0, a: 0 };
      inMode.forEach(s => { if (rec[s.id]) cnt[rec[s.id]]++; });
      const un = inMode.length - cnt.p - cnt.l - cnt.a;
      const nOff = all.filter(s => stuMode(s) === "offline").length, nOn = all.length - nOff;
      const dateLabel = new Date(attDate + "T12:00:00Z").toLocaleDateString(lang === "en" ? "en-GB" : "ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
      const pill = (on, extra) => `tap px-3.5 rounded-xl text-xs font-bold ${on ? 'gold-btn' : 'bg-zinc-900 text-gray-300 border border-yellow-500/25'} ${extra || ''}`;
      return `
        <div class="space-y-5">
          <div class="gold-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 class="font-display font-bold text-xl gold-gradient-text">✅ تسجيل الحضور</h2>

              <button onclick="openAddStu()" class="tap px-4 rounded-xl text-xs gold-btn">➕ إضافة طالب جديد</button>

              <input id="bkFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this)" />
            </div>
          </div>

          <div class="gold-card rounded-2xl p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap gap-2">
                <button onclick="attMode='offline'; render();" class="${pill(attMode === 'offline')}">🏫 طلبة الأوفلاين (${nOff})</button>
                <button onclick="attMode='online'; render();" class="${pill(attMode === 'online')}">💻 طلبة الأونلاين (${nOn})</button>
              </div>
              <input id="attQInp" value="${esc(attQ)}" oninput="attQ=this.value; render();" placeholder="🔍 ابحث باسم الطالب..." class="tap flex-1 min-w-[160px] max-w-xs bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-white" />
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="shiftDate(-1)" class="${pill(false)}">اليوم السابق</button>
              <input type="date" value="${attDate}" onchange="setAttDate(this.value)" class="tap bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-white" />
              <button onclick="shiftDate(1)" class="${pill(false)}">اليوم التالي</button>
              <button onclick="attDate=todayISO(); render();" class="${pill(attDate === todayISO())}">النهاردة</button>
              <span class="text-xs text-yellow-300 font-bold">${dateLabel}</span>
            </div>
            <div class="grid grid-cols-4 gap-2 text-center">
              <div class="p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/40"><div class="text-lg font-bold text-emerald-300">${cnt.p}</div><div class="text-[11px] text-gray-400">حاضر</div></div>
              <div class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/40"><div class="text-lg font-bold text-amber-300">${cnt.l}</div><div class="text-[11px] text-gray-400">متأخر</div></div>
              <div class="p-2 rounded-xl bg-red-500/10 border border-red-500/30"><div class="text-lg font-bold text-red-300">${cnt.a}</div><div class="text-[11px] text-gray-400">غايب</div></div>
              <div class="p-2 rounded-xl bg-black/70 border border-yellow-500/20"><div class="text-lg font-bold text-white">${un}</div><div class="text-[11px] text-gray-400">لم يُسجَّل</div></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="markAll('p')" class="tap px-3 rounded-xl text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">تحديد الكل حاضر</button>
              <button onclick="markAll('')" class="tap px-3 rounded-xl text-xs bg-zinc-900 text-gray-300 border border-yellow-500/20">مسح تسجيل اليوم</button>
            </div>
          </div>

          <div class="space-y-2">

    // re-render date label etc. when language flips on the attendance page
    { const _tl = toggleLang; toggleLang = function () { _tl(); if (tab === "attendance") render(); }; }

    // Background Animation
    const cv = document.getElementById("bgCanvas"), ctx = cv.getContext("2d");
    function rsz() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
    window.addEventListener("resize", rsz); rsz();
    const pts = Array.from({ length: 35 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.8 + 0.5, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 }));
    function anim() {

        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = document.documentElement.classList.contains("light") ? "rgba(153,116,21,0.28)" : "rgba(212,175,55,0.3)"; ctx.fill();

    // تحميل خط Cairo لدعم اللغة العربية في الشهادة بأناقة

    // 2. بنك الأسئلة التكتيكية المرتبط بالدروس لتوليد سؤال عشوائي لكل درس + اللغز اليومي المتغير
    const LESSON_QUESTION_PATTERNS = [
      { match: /mate|mating/i, q: (t) => `In "${t}", what is the primary objective to finish the game immediately?`, opts: ["Deliver a forced Checkmate net", "Trade all pawns", "Move the King to the corner"], ans: 0 },
      { match: /pin/i, q: (t) => `In "${t}", how do you maximize pressure on a pinned piece?`, opts: ["Attack it with a pawn or another piece (Pile up)", "Immediately retreat your pieces", "Offer a draw"], ans: 0 },
      { match: /double attack|twofold|fork/i, q: (t) => `In "${t}", what makes a double attack winning?`, opts: ["Creating two simultaneous threats the opponent cannot both defend", "Moving the same piece twice", "Trading Queens early"], ans: 0 },
      { match: /discovered|x-ray/i, q: (t) => `In "${t}", how do you make a discovered attack most devastating?`, opts: ["Move the front piece with a direct check or tempo threat", "Put the King in the center", "Pass the turn"], ans: 0 },
      { match: /defend|defence|eliminat/i, q: (t) => `In "${t}", what is the fastest way to break a strong defense?`, opts: ["Eliminate, capture, or lure away the key defending piece", "Wait passively", "Push flank pawns randomly"], ans: 0 },
      { match: /pawn|breakthrough|square|passed/i, q: (t) => `In "${t}", what is the key strategic goal in pawn play?`, opts: ["Create an unstoppable passed pawn and control key promotion squares", "Keep all pawns on the 2nd rank", "Give up the center"], ans: 0 },
      { match: /rook|seventh|open file/i, q: (t) => `In "${t}", how should Rooks be activated for maximum power?`, opts: ["Seize open files and penetrate to the 7th rank", "Keep Rooks locked behind unmoved pawns", "Trade Rooks for single pawns"], ans: 0 },
      { match: /draw|stalemate|wrong bishop/i, q: (t) => `In "${t}", when you are down material in the endgame, what resource can save the game?`, opts: ["Aim for Stalemate, perpetual check, or a theoretical draw fortress", "Resign immediately", "Expose the King to checks"], ans: 0 },
      { match: /opening|golden rules|castl/i, q: (t) => `In "${t}", what are the 3 Golden Rules of the opening?`, opts: ["Control the center, develop pieces quickly, and castle the King safely", "Bring the Queen out on move 2 and push all edge pawns", "Move only Knights"], ans: 0 }
    ];

    function buildLessonQuestion(lessonObj, idx, seedNum) {
      const title = lessonObj.t;
      const url = (lessonObj.l && lessonObj.l[0] && lessonObj.l[0][1]) ? lessonObj.l[0][1] : "https://lichess.org/training";
      let pat = LESSON_QUESTION_PATTERNS.find(p => p.match.test(title));
      let baseQ = pat ? pat.q(title) : `Tactical Evaluation — Lesson "${title}": Choose the most accurate chess principle:`;
      let rawOpts = pat ? [...pat.opts] : [
        `Apply the core tactical motif of "${title}" with calculation`,
        "Play a passive waiting move without a plan",
        "Give up material without compensation"
      ];
      // تبديل أماكن الاختيارات عشوائياً بناءً على البذرة (Seed) لضمان عدم حفظ المكان
      const shift = (seedNum + idx) % 3;
      const rotated = [0, 1, 2].map(i => ({ text: rawOpts[(i + shift) % 3], isCorrect: ((i + shift) % 3) === 0 }));
      return {
        lessonTitle: title,
        url: url,
        q: baseQ,
        opts: rotated.map(r => r.text),
        ans: rotated.findIndex(r => r.isCorrect)
      };
    }

    // 3. تحديث اللغز اليومي تلقائياً كل يوم بناءً على دروس كل Step (الشرط رقم 6)
    function updateDailyPuzzlesByDate() {
      const dayKey = todayISO(); // YYYY-MM-DD
      const dayHash = dayKey.split("-").reduce((acc, v) => acc + parseInt(v, 10) * 31, 7);
      STEPS.forEach(st => {
        if (st.lessons && st.lessons.length > 0) {
          const lessonIdx = dayHash % st.lessons.length;
          const les = st.lessons[lessonIdx];
          const generated = buildLessonQuestion(les, lessonIdx, dayHash);
          PUZZLES[st.step] = {
            q: `[لغز اليوم ${dayKey} — درس: ${les.t}] ${generated.q}`,
            opts: generated.opts,
            ans: generated.ans,
            url: generated.url,
            dayKey: dayKey
          };
        }
      });
    }

    // فتح اللغز اليومي تلقائياً عندما يتغير اليوم
    function ensureDailyPuzzleFreshForUser(u) {
      updateDailyPuzzlesByDate();

              : `<button onclick="requestExamRetry()" class="px-4 py-2 rounded-xl text-xs gold-btn">📩 إرسال طلب إعادة الاختبار للكوتش</button>`
            }

      } else {
        examActionHtml = `

            <span class="text-xs text-emerald-300 font-bold">✅ أتممت 100% من الحضور! اختبار الترقية متاح الآن (محاولة واحدة - النجاح من 70%):</span>

      const replaced = html.replace(
        /<div class="mt-4 pt-3 border-t border-yellow-500\/20 flex justify-between items-center">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>\s*<\/div>$/,
        examActionHtml + `</div></div>` + (certs.length ? renderStudentCertificatesBox(stu) : "") + `</div>`

    function renderStudentCertificatesBox(stu) {

    // 5. طلب إعادة الاختبار وموافقة الكوتش (الشرط رقم 5)
    window.requestExamRetry = function() {
      const u = currUser(); if (!u) return;
      u.examState = u.examState || {};
      const st = Number(u.level);
      if (u.examState[st]) {
        u.examState[st].reqRetry = true;
        save(); render();
        toast("📩 تم إرسال طلب إعادة الاختبار للمدرب المسؤول");
      }
    };

    window.approveExamRetry = function(stuId, stepNum) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === stuId); if (!s) return;
      if (s.examState && s.examState[stepNum]) {
        delete s.examState[stepNum];
      }
      save(); render();
      toast("✅ تمت الموافقة على إعادة الاختبار للطالب " + s.name);
    };

    window.assignStudentCoach = function(stuId, coachName) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === stuId); if (!s) return;
      s.coachName = coachName.trim();
      save(); toast("✅ تم تحديث اسم المدرب المسؤول عن الطالب");
    };

    // إضافة إشعار طلبات إعادة الاختبار وخانة اسم المدرب في لوحة تحكم المدرب
    const _origRenderTrackerView = renderTrackerView;
    renderTrackerView = function() {
      const baseHtml = _origRenderTrackerView();
      const students = db.users.filter(u => u.role === "student");
      const retryRequests = [];
      students.forEach(s => {
        if (s.examState) {
          Object.keys(s.examState).forEach(stKey => {
            const inf = s.examState[stKey];
            if (inf && inf.status === "failed" && inf.reqRetry) {
              retryRequests.push({ stu: s, step: stKey, score: inf.score });
            }
          });
        }
      });

      const retryBanner = retryRequests.length ? `
        <div class="gold-card rounded-2xl p-4 mb-5 border-2 border-amber-500/60 bg-amber-950/20">
          <h3 class="font-bold text-sm text-yellow-300 mb-2">🔔 طلبات إعادة اختبار الترقية بانتظار موافقتك (${retryRequests.length}):</h3>
          <div class="space-y-2">
            ${retryRequests.map(r => `
              <div class="flex flex-wrap justify-between items-center gap-2 p-2.5 rounded-xl bg-black/80 border border-yellow-500/30 text-xs">
                <span class="text-white font-bold">${esc(r.stu.name)} (@${esc(r.stu.username)}) — Step${r.step} <span class="text-red-300">(الدرجة السابقة: ${r.score}%)</span></span>
                <button onclick="approveExamRetry('${r.stu.id}', '${r.step}')" class="px-3 py-1.5 rounded-xl text-xs gold-btn">✓ الموافقة على إعادة الاختبار</button>
              </div>
            `).join("")}
          </div>
        </div>` : "";

      const sel = students.find(s => s.id === selStuId) || students[0] || null;
      let extraCoachControls = "";
      if (sel) {
        const curCoach = sel.coachName || (currUser() && currUser().name) || "الكوتش عبدالرحمن منصور";
        const certs = sel.certificates || [];
        extraCoachControls = `
          <div class="gold-card rounded-2xl p-4 mt-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2 flex-1">
              <span class="text-xs text-yellow-300 font-bold">👨‍🏫 اسم الكوتش في شهادة الطالب (${esc(sel.name)}):</span>
              <input id="stuCoachInp" value="${esc(curCoach)}" onchange="assignStudentCoach('${sel.id}', this.value)" class="bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-white" />
            </div>

          </div>`;
      }

      return retryBanner + baseHtml + extraCoachControls;
    };

    // 6. نظام الاختبار التفاعلي الشامل (لغز من كل درس + نجاح من 70% + محاولة واحدة)
    let activeExam = null;
    openExamModal = function(lvl) {
      const u = currUser();
      if (!u || u.role !== "student") return;
      const stepNum = Number(lvl);
      const stats = calcStats(u);

      if (stats.attP < 100) {
        return toast("🔒 يجب إتمام حضور 100% من دروس هذا المستوى أولاً لفتح الاختبار!");
      }
      u.examState = u.examState || {};
      if (u.examState[stepNum] && u.examState[stepNum].status === "failed") {
        return toast("❌ استنفدت محاولتك في هذا الاختبار. اطلب إعادة الاختبار من المدرب.");
      }

      const stObj = STEPS.find(x => x.step === stepNum);
      if (!stObj || !stObj.lessons || stObj.lessons.length === 0) {
        return toast("لا توجد دروس مسجلة في هذا المستوى حالياً");
      }

      const seed = Date.now() % 997;
      const questions = stObj.lessons.map((les, idx) => buildLessonQuestion(les, idx, seed));
      activeExam = { step: stepNum, questions, answers: {} };

      const modal = document.getElementById("examModal");
      modal.classList.remove("hidden");
      renderActiveExamUI();
    };

    function renderActiveExamUI() {
      if (!activeExam) return;
      const total = activeExam.questions.length;
      const answeredCount = Object.keys(activeExam.answers).length;
      document.getElementById("examTitle").innerHTML = `🏆 اختبار ترقية Step ${activeExam.step} (${answeredCount}/${total} سؤال)`;
      document.getElementById("examBody").innerHTML = `

        <div class="space-y-4 max-h-[55vh] overflow-y-auto pr-1">

              <div class="space-y-1.5">

                  return `
                    <button type="button" onclick="selectExamAns(${qIdx}, ${oIdx})" class="w-full text-left px-3 py-2 rounded-lg text-xs border transition flex justify-between items-center ${chosen ? 'border-yellow-400 bg-yellow-500/20 text-yellow-200 font-bold' : 'border-zinc-800 bg-zinc-900/80 text-gray-300 hover:border-yellow-500/40'}">
                      <span>${esc(optTxt)}</span>
                      <span>${chosen ? '●' : '○'}</span>
                    </button>`;
                }).join("")}
              </div>
            </div>
          `).join("")}
        </div>
        <div class="mt-4 pt-3 border-t border-yellow-500/20 flex justify-between items-center">
          <span class="text-xs text-gray-400">أجبت على ${answeredCount} من ${total}</span>
          <button type="button" onclick="submitFullStepExam()" class="px-5 py-2.5 rounded-xl text-xs gold-btn">تسليم الاختبار والنتيجة النهائية 🚀</button>
        </div>
      `;
    }
window.selectExamAns = function(qIdx, oIdx) {
   if (!activeExam) return;
   const box = document.querySelector("#examBody .overflow-y-auto");
   const prevTop = box ? box.scrollTop : 0;
   activeExam.answers[qIdx] = oIdx;
   renderActiveExamUI();
   const newBox = document.querySelector("#examBody .overflow-y-auto");
   if (newBox) newBox.scrollTop = prevTop;
 };

    window.submitFullStepExam = async function() {
      if (!activeExam) return;
      const total = activeExam.questions.length;
      if (Object.keys(activeExam.answers).length < total) {
        return toast("⚠️ يرجى الإجابة على جميع أسئلة الدروس قبل التسليم!");
      }
      let correct = 0;
      activeExam.questions.forEach((qObj, idx) => {
        if (activeExam.answers[idx] === qObj.ans) correct++;
      });
      const score = Math.round((correct / total) * 100);
      const u = currUser(); if (!u) return;
      const oldStep = activeExam.step;
      u.examState = u.examState || {};

      if (score >= 70) {
        u.examState[oldStep] = { status: "passed", score: score, date: todayISO() };
        const coachUser = db.users.find(x => x.role === "coach");
        const coachName = u.coachName || (coachUser ? coachUser.name : "الكوتش عبدالرحمن منصور");
        u.certificates = u.certificates || [];
        u.certificates.push({
          step: oldStep,
          score: score,
          studentName: u.name,
          coachName: coachName,
          date: todayISO()
        });
        const newLevel = Math.min(6, oldStep + 1);
        u.level = newLevel;
        save();
        closeExamModal();
        render();
        toast(`🎉 مبروك! نجحت بنسبة ${score}% وتمت ترقيتك إلى Step ${newLevel}`);
        // توليد الشهادة وعرض نافذة الإرسال لولي الأمر فوراً
        setTimeout(() => {
          previewAndDownloadCert(u.id, u.certificates.length - 1, true);
        }, 400);
      } else {
        u.examState[oldStep] = { status: "failed", score: score, reqRetry: false, date: todayISO() };
        save();
        closeExamModal();
        render();
        toast(`❌ حصلت على ${score}% (المطلوب 70%). تم قفل الاختبار ويمكنك طلب إعادة الاختبار من المدرب.`);
      }
    };

// 7. رسم الشهادة وعرضها في نافذة معاينة مع طباعة PDF وتنزيل مباشر مضمون 100%
    window.buildCertificateDataURL = async function(cert) {
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (_) {}
      }
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 1130;
      const c = canvas.getContext("2d");

      // خلفية كريمي مطابقة للشهادة الرسمية
      c.fillStyle = "#faf3e3";
      c.fillRect(0, 0, canvas.width, canvas.height);

      // الإطار الخارجي والداخلي
      c.strokeStyle = "#1b2420";
      c.lineWidth = 14;
      c.strokeRect(36, 36, canvas.width - 72, canvas.height - 72);

      c.strokeStyle = "#c59b27";
      c.lineWidth = 4;
      c.strokeRect(58, 58, canvas.width - 116, canvas.height - 116);

      // علامة مائية خفيفة
      c.save();
      c.globalAlpha = 0.05;
      c.fillStyle = "#1b2420";
      c.font = "900 160px Cinzel, serif";
      c.textAlign = "center";
      c.fillText("ECA CHESS", canvas.width / 2, canvas.height / 2 + 40);
      c.restore();

      // العنوان العلوي: EGYPT CHESS ACADEMY (ECA)
      c.fillStyle = "#9a7418";
      c.font = "800 32px Cinzel, serif";
      c.textAlign = "center";
      c.fillText("EGYPT CHESS ACADEMY (ECA)", canvas.width / 2, 145);

      // شهادة تقدير
      c.fillStyle = "#18221f";
      c.font = "900 90px Cairo, sans-serif";
      c.fillText("شهادة تقدير", canvas.width / 2, 270);

      // خط زخرفي
      c.strokeStyle = "#c59b27";
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(canvas.width / 2 - 220, 310);
      c.lineTo(canvas.width / 2 + 220, 310);
      c.stroke();

      // تمنح هذه الشهادة للمتدرب
      c.fillStyle = "#4b5563";
      c.font = "700 34px Cairo, sans-serif";
      c.fillText("تمنح هذه الشهادة للمتدرب", canvas.width / 2, 390);

      // اسم الطالب
      c.fillStyle = "#b07d12";
      c.font = "900 64px Cairo, sans-serif";
      c.fillText(cert.studentName, canvas.width / 2, 490);

      // نص التقدير
      c.fillStyle = "#1f2937";
      c.font = "600 30px Cairo, sans-serif";
      c.fillText(`تقديراً لأدائه الرائع والتزامه المتميز في التدريبات الشطرنجية، واجتيازه مستوى (Step ${cert.step}) بنسبة ${cert.score}%،`, canvas.width / 2, 580);
      c.fillText("ونتمنى له دوام التقدم والتفوق في رحلته مع الشطرنج.", canvas.width / 2, 640);

      // التوقيعات السفلية: المدرب (يمين) - الشعار (منتصف) - إدارة الأكاديمية (يسار)
      c.fillStyle = "#18221f";
      c.font = "800 34px Cairo, sans-serif";
      c.fillText(cert.coachName, 1220, 855);
      c.strokeStyle = "#9ca3af";
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(1040, 880); c.lineTo(1400, 880); c.stroke();
      c.fillStyle = "#6b7280";
      c.font = "700 26px Cairo, sans-serif";
      c.fillText("المدرب", 1220, 925);

      // الشعار في المنتصف
      c.beginPath();
      c.arc(canvas.width / 2, 880, 78, 0, Math.PI * 2);
      c.fillStyle = "#18221f";
      c.fill();
      c.lineWidth = 5;
      c.strokeStyle = "#d4af37";
      c.stroke();
      c.fillStyle = "#d4af37";
      c.font = "800 34px Cinzel, serif";
      c.fillText("ECA", canvas.width / 2, 875);
      c.font = "700 20px Cinzel, serif";
      c.fillText("CHESS", canvas.width / 2, 907);

      // إدارة الأكاديمية
      c.fillStyle = "#18221f";
      c.font = "800 24px Cinzel, serif";
      c.fillText("EGYPT CHESS ACADEMY (ECA)", 380, 855);
      c.beginPath(); c.moveTo(200, 880); c.lineTo(560, 880); c.stroke();
      c.fillStyle = "#6b7280";
      c.font = "700 26px Cairo, sans-serif";
      c.fillText("إدارة الأكاديمية", 380, 925);

      // التاريخ
      c.fillStyle = "#9ca3af";
      c.font = "600 20px Inter, sans-serif";
      c.fillText(`Issued on: ${cert.date} • Official ECA Certificate`, canvas.width / 2, 1035);

      return canvas.toDataURL("image/png");
    };

            <a href="${dataUrl}" download="ECA-Certificate-Step${cert.step}-${stu.username}.png" class="px-4 py-2.5 rounded-xl text-xs bg-zinc-800 border border-yellow-500/40 text-yellow-300 font-bold">📥 تنزيل كصورة جاهزة</a>
            <a href="${waBase}?text=${waMsg}" target="_blank" rel="noopener" class="px-4 py-2.5 rounded-xl text-xs bg-emerald-500 text-black font-bold">💬 إرسال لواتساب ولي الأمر</a>
          </div>

      `;

      // إذا ضغط المستخدم على زر التحميل المباشر، نقوم بتنزيل ملف PDF أو الصورة فوراً
      if (!openWaAfter) {

    window.printCertAsPDF = function() {

    const firestore = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

    // ===================== أدوات مساعدة =====================
    const MAIL_SUFFIX = "@eca.local";                  // الطلاب بيدخلوا بـ username؛ بنحوله لإيميل داخلي
    const BAD = /[<>"'`]/g;                            // حروف ممنوعة (حماية من حقن HTML)
    const FIN_KEYS = ["courseFee", "amountPaid", "remaining", "lastPayDate", "lastPayAmount"];   // مالية: للأدمن فقط
    const PRIV_KEYS = ["note", "parentCode"];                                                     // ملاحظة سرية: للكوتش وولي الأمر فقط
    const plain = o => JSON.parse(JSON.stringify(o));
    function cleanDeep(v) {
      if (typeof v === "string") return v.replace(BAD, "");
      if (Array.isArray(v)) return v.map(cleanDeep);
      if (v && typeof v === "object") { const o = {}; for (const k in v) o[String(k).replace(BAD, "")] = cleanDeep(v[k]); return o; }
      return v;
    }
    function toAuthEmail(idf) {
      idf = String(idf || "").trim().toLowerCase();
      if (idf.includes("@")) return idf;               // الكوتش/الأدمن بإيميلهم الحقيقي
      const local = idf.replace(/\s+/g, "_").replace(/[^a-z0-9._-]/g, c => "_x" + c.charCodeAt(0).toString(16) + "_");
      return (local || "user") + MAIL_SUFFIX;
    }
    const isStaffRole = r => r === "coach" || r === "admin";

    // ===================== الحالة =====================
    let me = null;                       // { uid, role: coach|admin|student|parent, name, username, email }
    let unsubs = [];
    let maps = { core: {}, priv: {}, fin: {}, att: {} };
    let synced = {};                     // مفتاح -> آخر JSON اتكتب/اتقرا (عشان نكتب اللي اتغير بس)
    let loaded = { core: false, att: false, groups: false };
    let applyingRemote = false, signingUp = false;

    function resetState() {
      unsubs.forEach(u => { try { u(); } catch (_) {} }); unsubs = [];
      maps = { core: {}, priv: {}, fin: {}, att: {} }; synced = {};
      loaded = { core: false, att: false, groups: false };
    }

    function split(u) {
      const core = {}, priv = {}, fin = {};
      for (const k of Object.keys(u)) {
        if (k === "id" || k === "pass" || k === "isAdmin") continue;
        if (PRIV_KEYS.includes(k)) priv[k] = u[k];
        else if (FIN_KEYS.includes(k)) fin[k] = u[k];
        else core[k] = u[k];
      }
      core.role = "student";
      return { core: plain(core), priv: plain(priv), fin: plain(fin) };
    }

    // يبني db.users من الخرائط المحلية ويعيد الرسم
    function rebuild() {
      applyingRemote = true;
      try {
        const keepId = db.currId;
        const users = [];
        if (me && isStaffRole(me.role)) users.push({ id: me.uid, name: me.name, username: me.username, email: me.email, role: "coach", isAdmin: me.role === "admin" });
        Object.keys(maps.core).forEach(id => {
          const u = Object.assign({}, maps.core[id], { id, role: "student" }, maps.priv[id] || {}, maps.fin[id] || {});
          users.push(u);
          const p = split(u);
          synced["c:" + id] = JSON.stringify(p.core);
          if (Object.keys(p.priv).length) synced["p:" + id] = JSON.stringify(p.priv);
          if (Object.keys(p.fin).length) synced["f:" + id] = JSON.stringify(p.fin);
        });
        db.users = users; db.currId = keepId;
        window.isFinanceAdminUnlocked = !!(me && me.role === "admin");
      } finally { applyingRemote = false; }
      render();
    }

    // ===================== المزامنة (بنكتب الوثائق اللي اتغيرت بس) =====================
    window.syncToCloud = async function () {
      if (applyingRemote || !me) return;
      const staff = isStaffRole(me.role), admin = me.role === "admin";
      const jobs = [];
      const push = (key, json, run) => {
        if (synced[key] === json) return;
        const prev = synced[key]; synced[key] = json;
        jobs.push(async () => { try { await run(); } catch (err) { synced[key] = prev; console.error("Cloud Sync Error:", key, err); } });
      };
      try {
        const present = new Set();
        for (const u of db.users) {
          if (u.role !== "student") continue;
          if (!staff && u.id !== me.uid) continue;
          present.add(u.id);
          const p = split(u);
          if (!staff && !loaded.core) continue;
          push("c:" + u.id, JSON.stringify(p.core), () => staff ? setDoc(doc(firestore, "users", u.id), p.core) : updateDoc(doc(firestore, "users", u.id), p.core));
          if (staff && Object.keys(p.priv).length) push("p:" + u.id, JSON.stringify(p.priv), () => setDoc(doc(firestore, "private", u.id), p.priv));
          if (admin && Object.keys(p.fin).length) push("f:" + u.id, JSON.stringify(p.fin), () => setDoc(doc(firestore, "finance", u.id), p.fin));
        }
        if (staff) {
          if (loaded.core) {
            Object.keys(synced).forEach(key => {
              const kind = key.slice(0, 2), id = key.slice(2);
              if ((kind === "c:" || kind === "p:" || kind === "f:") && !present.has(id)) {
                const coll = kind === "c:" ? "users" : kind === "p:" ? "private" : "finance";
                if (coll === "finance" && !admin) return;
                delete synced[key];
                jobs.push(async () => { try { await deleteDoc(doc(firestore, coll, id)); } catch (err) { console.error("Cloud Delete Error:", key, err); } });
              }
            });
          }
          if (loaded.att) {
            const dates = Object.keys(db.attendance || {});
            dates.forEach(d => push("a:" + d, JSON.stringify(db.attendance[d]), () => setDoc(doc(firestore, "attendance", d), { r: plain(db.attendance[d]) })));
            Object.keys(synced).forEach(key => {
              if (key.startsWith("a:") && !(key.slice(2) in (db.attendance || {}))) {
                const d = key.slice(2); delete synced[key];
                jobs.push(async () => { try { await deleteDoc(doc(firestore, "attendance", d)); } catch (err) { console.error(err); } });
              }
            });
          }
          if (loaded.groups) push("g", JSON.stringify(db.groups || []), () => setDoc(doc(firestore, "meta", "groups"), { list: plain(db.groups || []) }));
        }
        for (const j of jobs) await j();
      } catch (err) { console.error("Cloud Sync Error:", err); }
    };

    // ===================== الاستماع للتغييرات =====================
    function applyColl(kind, snap) {
      const next = {};
      snap.forEach(d => { next[d.id] = cleanDeep(d.data()); });
      Object.keys(maps[kind]).forEach(id => { if (!(id in next)) delete maps[kind][id]; });
      Object.keys(next).forEach(id => { maps[kind][id] = next[id]; });
      if (kind === "core") { loaded.core = true; window.__authLoading = false; }
      rebuild();
    }
    function applyAtt(snap) {
      const att = {};
      snap.forEach(d => { const r = (d.data() || {}).r; if (r && typeof r === "object" && Object.keys(r).length) att[d.id] = cleanDeep(r); });
      db.attendance = att; loaded.att = true;
      Object.keys(synced).forEach(k => { if (k.startsWith("a:")) delete synced[k]; });
      Object.keys(att).forEach(d => { synced["a:" + d] = JSON.stringify(att[d]); });
      render();
    }
    function applyGroups(snap) {
      const list = snap.exists() && Array.isArray(snap.data().list) ? cleanDeep(snap.data().list) : [];
      db.groups = list; loaded.groups = true; synced["g"] = JSON.stringify(list);
      render();
    }
    function onErr(label) { return err => { console.error("Firestore listener error (" + label + "):", err); window.__authLoading = false; if (window.toast) toast("⚠️ مفيش صلاحية لقراءة: " + label); }; }

    function startListeners() {
      if (!me) return;
      if (isStaffRole(me.role)) {
        unsubs.push(onSnapshot(collection(firestore, "users"), s => applyColl("core", s), onErr("users")));
        unsubs.push(onSnapshot(collection(firestore, "private"), s => applyColl("priv", s), onErr("private")));
        if (me.role === "admin") unsubs.push(onSnapshot(collection(firestore, "finance"), s => applyColl("fin", s), onErr("finance")));
        unsubs.push(onSnapshot(collection(firestore, "attendance"), applyAtt, onErr("attendance")));
      } else if (me.role === "student") {
        unsubs.push(onSnapshot(doc(firestore, "users", me.uid), snap => {
          if (snap.exists()) {
            maps.core = {}; maps.core[me.uid] = cleanDeep(snap.data());
            loaded.core = true; window.__authLoading = false; rebuild();
          } else if (!signingUp) {
            window.__authLoading = false;
            if (window.toast) toast("❌ الحساب ده مش مربوط ببيانات طالب. كلّم الكوتش.");
            signOut(auth);
          }
        }, onErr("users")));
      }
      unsubs.push(onSnapshot(doc(firestore, "meta", "groups"), applyGroups, onErr("groups")));
    }

    // ===================== حالة الدخول =====================
    async function initUser(user) {
      resetState();
      if (!user) {
        me = null; db.users = []; db.currId = null; db.attendance = {}; db.groups = [];
        window.isFinanceAdminUnlocked = false; window.__authLoading = false; render(); return;
      }
      if (user.isAnonymous) {
        me = { uid: user.uid, role: "parent" }; db.users = []; db.currId = null;
        window.__authLoading = false; render(); return;
      }
      let staffData = null;
      try { const s = await getDoc(doc(firestore, "staff", user.uid)); if (s.exists()) staffData = s.data(); } catch (_) {}
      if (staffData) {
        me = { uid: user.uid, role: staffData.role === "admin" ? "admin" : "coach", name: String(staffData.name || "Coach").replace(BAD, ""), username: String(staffData.username || "coach").replace(BAD, ""), email: user.email || "" };
      } else {
        me = { uid: user.uid, role: "student", email: user.email || "" };
      }
      db.currId = user.uid;
      window.isFinanceAdminUnlocked = me.role === "admin";
      startListeners();
    }
    onAuthStateChanged(auth, (user) => { if (signingUp) return; initUser(user); });

    // ===================== واجهات تستدعيها الصفحة =====================
    window.fbLogin = async (idf, pass) => {
      try { await signInWithEmailAndPassword(auth, toAuthEmail(idf), pass); return { ok: true }; }
      catch (e) { return { ok: false, code: e && e.code }; }
    };
    window.fbLogout = async () => { try { await signOut(auth); } catch (_) {} };

    window.fbSignup = async ({ name, username, email, pass, level }) => {
      signingUp = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, toAuthEmail(username), pass);
        let group = "";
        try { const g = await getDoc(doc(firestore, "meta", "groups")); if (g.exists() && Array.isArray(g.data().list)) group = String(g.data().list[0] || ""); } catch (_) {}
        const profile = { name, username, email: email || "", role: "student", level: Number(level) || 1, group, mode: "offline", att: {}, hw: {}, puz: { t: 0, c: 0 } };
        await setDoc(doc(firestore, "users", cred.user.uid), profile);
        await initUser(cred.user);
        return { ok: true };
      } catch (e) {
        return { ok: false, code: e && e.code };
      } finally { signingUp = false; }
    };

    // تسجيل كوتش جديد بكود دعوة (الكود بيتراجع في Firestore Rules مش في الصفحة، ومرة واحدة)
    window.fbCoachSignup = async ({ name, username, email, pass, code }) => {
      code = String(code || "").trim().toUpperCase();
      if (!/^[A-Z0-9]{8,16}$/.test(code)) return { ok: false, code: "bad-invite" };
      signingUp = true; let cred = null;
      try {
        cred = await createUserWithEmailAndPassword(auth, String(email).trim().toLowerCase(), pass);
        const batch = writeBatch(firestore);
        batch.update(doc(firestore, "invites", code), { used: true, usedBy: cred.user.uid });
        batch.set(doc(firestore, "staff", cred.user.uid), { role: "coach", name, username, invite: code });
        await batch.commit();
        await initUser(cred.user);
        return { ok: true };
      } catch (e) {
        if (cred) { try { await deleteUser(cred.user); } catch (_) {} await initUser(null); }
        return { ok: false, code: e && e.code };
      } finally { signingUp = false; }
    };
    window.fbCreateInvite = async () => {
      if (!me || me.role !== "admin") return null;
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const r = crypto.getRandomValues(new Uint8Array(10));
      let code = ""; for (const b of r) code += alphabet[b % alphabet.length];
      try { await setDoc(doc(firestore, "invites", code), { used: false, createdBy: me.uid, createdAt: Date.now() }); return code; }
      catch (e) { console.error(e); return null; }
    };

    // الكوتش بينشئ حساب طالب بدون ما يتسجّل خروج (بنستخدم نسخة ثانية من التطبيق)
    let secApp = null;
    window.fbCreateStudentAccount = async (username, pass) => {
      if (!secApp) secApp = initializeApp(firebaseConfig, "secondary");
      const a = getAuth(secApp);
      const cred = await createUserWithEmailAndPassword(a, toAuthEmail(username), pass);
      const uid = cred.user.uid;
      try { await signOut(a); } catch (_) {}
      return uid;
    };

    window.fbOnStudentDeleted = async (id) => {
      try { await setDoc(doc(firestore, "deleted", id), { at: Date.now() }); } catch (e) { console.error(e); }
      try {
        const q = await getDocs(query(collection(firestore, "parentLinks"), where("sid", "==", id)));
        for (const d of q.docs) await deleteDoc(d.ref);
      } catch (e) { console.error(e); }
    };

    window.fbChangePassword = async (oldP, newP) => {
      try {
        const u = auth.currentUser; if (!u || !u.email) return { ok: false };
        await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, oldP));
        await updatePassword(u, newP);
        return { ok: true };
      } catch (e) { return { ok: false, code: e && e.code }; }
    };

    // ===================== ولي الأمر (كود متابعة) =====================
    window.fbParentLookup = async (codeRaw) => {
      const code = String(codeRaw || "").trim().toUpperCase();
      if (!/^[A-Z0-9]{8,16}$/.test(code)) return { ok: false, code: "bad" };
      try {
        if (!auth.currentUser) await signInAnonymously(auth);
        const uid = auth.currentUser.uid;
        const c = await getDoc(doc(firestore, "parentCodes", code));
        if (!c.exists()) return { ok: false, code: "notfound" };
        const sid = c.data().sid;
        await setDoc(doc(firestore, "parentLinks", uid + "_" + sid), { code, sid });
        const u = await getDoc(doc(firestore, "users", sid));
        let p = {}; try { const ps = await getDoc(doc(firestore, "private", sid)); if (ps.exists()) p = ps.data(); } catch (_) {}
        if (!u.exists()) return { ok: false, code: "notfound" };
        return { ok: true, stu: Object.assign({}, cleanDeep(u.data()), { id: sid, role: "student" }, cleanDeep(p)) };
      } catch (e) { return { ok: false, code: e && e.code }; }
    };

    window.fbGenParentCode = async (sid) => {
      if (!me || !isStaffRole(me.role)) return null;
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const r = crypto.getRandomValues(new Uint8Array(12));
      let code = ""; for (const b of r) code += alphabet[b % alphabet.length];
      const u = db.users.find(x => x.id === sid); if (!u) return null;
      const old = u.parentCode;
      await setDoc(doc(firestore, "parentCodes", code), { sid });
      if (old) { try { await deleteDoc(doc(firestore, "parentCodes", old)); } catch (_) {} }
      // تجديد الكود = سحب صلاحية أي جهاز كان مربوط بالكود القديم
      try {
        const q = await getDocs(query(collection(firestore, "parentLinks"), where("sid", "==", sid)));
        for (const d of q.docs) await deleteDoc(d.ref);
      } catch (_) {}
      u.parentCode = code; save();
      return code;
    };

    // ===================== ترحيل الطلاب من النظام القديم (للأدمن، مرة واحدة) =====================
    window.fbMigrateLegacy = async () => {
      if (!me || me.role !== "admin") return { ok: false, msg: "للأدمن فقط" };
      const snap = await getDoc(doc(firestore, "eca_platform", "main_data"));
      if (!snap.exists()) return { ok: false, msg: "مفيش بيانات قديمة" };
      const L = snap.data();
      const legacy = (L.users || []).filter(u => u && u.role === "student");
      const have = new Set(db.users.filter(u => u.role === "student").map(u => String(u.username || "").toLowerCase()));
      const idMap = {}, creds = [], failed = [];
      for (const lu of legacy) {
        const uname = String(lu.username || "").toLowerCase().replace(/\s+/g, "_").replace(BAD, "");
        if (!uname || have.has(uname)) continue;
        const temp = window.randomPass();
        try {
          const uid = await window.fbCreateStudentAccount(uname, temp);
          idMap[lu.id] = uid;
          const nu = cleanDeep(Object.assign({}, lu)); delete nu.pass; nu.id = uid; nu.username = uname; nu.role = "student";
          db.users.push(nu); have.add(uname);
          creds.push([lu.name || "", uname, temp]);
        } catch (e) { failed.push([uname, (e && e.code) || String(e)]); }
      }
      const att = L.attendance || {};
      for (const d in att) {
        for (const oldId in att[d]) if (idMap[oldId]) { db.attendance[d] = db.attendance[d] || {}; db.attendance[d][idMap[oldId]] = att[d][oldId]; }
      }
      (L.groups || []).forEach(g => { g = String(g).replace(BAD, ""); if (g && !db.groups.includes(g)) db.groups.push(g); });
      save();
      if (creds.length) {
        const rows = [["Name", "Username", "Temporary Password"]].concat(creds);
        const csv = "\ufeff" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
        dl("ECA-new-logins-" + todayISO() + ".csv", csv, "text/csv;charset=utf-8");
      }
      return { ok: true, done: creds.length, failed };
    };
    // ================= ECA FINANCIAL & ANALYTICS DASHBOARD (CONVERTED FROM CODE.GS & HTML) =================
   // ================= ECA FINANCIAL & ANALYTICS DASHBOARD (SELF-BINDING) =================
    window.finSubTab = window.finSubTab || "analytics";
    window.finSearchQ = window.finSearchQ || "";
    window.finSelectedStuId = window.finSelectedStuId || "";

    window.ensureStudentFinData = function(s, idx) {
      if (!s.stuCode) s.stuCode = "ECA-" + String(idx + 1).padStart(4, "0");
      s.courseFee = Number(s.courseFee) || 0;
      s.amountPaid = Number(s.amountPaid) || 0;
      s.remaining = Math.max(0, s.courseFee - s.amountPaid);
      if (!s.coachName) s.coachName = "Coach Abdelrahman";
      return s;
    };

    window.renderFinanceDashboardView = function() {
      const students = db.users.filter(u => u.role === "student").map((s, idx) => window.ensureStudentFinData(s, idx));
      const todayKey = todayISO();

      let totalFees = 0, totalPaid = 0, totalRem = 0;
      let todayCount = 0, todayPaid = 0, todayRem = 0;
      const byStep = {};
      const byCoach = {};

      students.forEach(s => {
        totalFees += s.courseFee;
        totalPaid += s.amountPaid;
        totalRem += s.remaining;

        if (s.lastPayDate === todayKey) {
          todayCount++;
          todayPaid += Number(s.lastPayAmount) || 0;
          todayRem += s.remaining;
        }

        const stLabel = "Step " + (s.level || 1);
        byStep[stLabel] = byStep[stLabel] || { count: 0, paid: 0, fee: 0 };
        byStep[stLabel].count++;
        byStep[stLabel].paid += s.amountPaid;
        byStep[stLabel].fee += s.courseFee;

        const cName = s.coachName || "Coach Abdelrahman";
        byCoach[cName] = byCoach[cName] || { count: 0, paid: 0, fee: 0 };
        byCoach[cName].count++;
        byCoach[cName].paid += s.amountPaid;
        byCoach[cName].fee += s.courseFee;
      });

      const tabBtnCls = (t) => `flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition ${window.finSubTab === t ? 'gold-btn' : 'bg-zinc-900 text-gray-300 border border-yellow-500/20 hover:border-yellow-400'}`;

      return `
        <div class="space-y-6">
          <div class="gold-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 class="font-display font-bold text-xl gold-gradient-text">📊 لوحة تحليلات وحسابات الأكاديمية (ECA ERP Dashboard)</h2>
              <p class="text-xs text-gray-400 mt-1">إدارة الاشتراكات، المسدد، المتبقي، إحصائيات اليوم، وتحليل الإيرادات حسب المستوى والمدرب.</p>
            </div>
            <button onclick="exportFinanceCSV()" class="px-4 py-2 rounded-xl text-xs gold-btn">⬇ تصدير التقرير المالي (Excel/CSV)</button>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="gold-card rounded-2xl p-4 text-center border-t-4 border-sky-500">
              <div class="text-[11px] text-gray-400 font-bold">إجمالي الطلاب (TOTAL STUDENTS)</div>
              <div class="text-2xl font-extrabold text-sky-400 mt-1">${students.length}</div>
            </div>
            <div class="gold-card rounded-2xl p-4 text-center border-t-4 border-yellow-500">
              <div class="text-[11px] text-gray-400 font-bold">إجمالي قيمة الاشتراكات (TOTAL FEES)</div>
              <div class="text-2xl font-extrabold text-yellow-300 mt-1">${totalFees.toLocaleString()} <span class="text-xs">EGP</span></div>
            </div>
            <div class="gold-card rounded-2xl p-4 text-center border-t-4 border-emerald-500">
              <div class="text-[11px] text-gray-400 font-bold">إجمالي المسدد (TOTAL PAID)</div>
              <div class="text-2xl font-extrabold text-emerald-400 mt-1">${totalPaid.toLocaleString()} <span class="text-xs">EGP</span></div>
            </div>
            <div class="gold-card rounded-2xl p-4 text-center border-t-4 border-red-500">
              <div class="text-[11px] text-gray-400 font-bold">إجمالي المتبقي (REMAINING)</div>
              <div class="text-2xl font-extrabold text-red-400 mt-1">${totalRem.toLocaleString()} <span class="text-xs">EGP</span></div>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 bg-black/60 p-2 rounded-2xl border border-yellow-500/20">
            <button onclick="window.finSubTab='analytics'; render();" class="${tabBtnCls('analytics')}">📈 الداشبورد والتحليلات</button>
            <button onclick="window.finSubTab='manage'; render();" class="${tabBtnCls('manage')}">💳 تسجيل وبحث وتعديل اشتراك طالب</button>
            <button onclick="window.finSubTab='today'; render();" class="${tabBtnCls('today')}">💰 إحصائيات وتحصيلات اليوم (${todayKey})</button>
          </div>

          ${window.finSubTab === "analytics" ? window.renderFinAnalyticsSection(students, byStep, byCoach, totalFees) : ""}

    window.saveStudentFinanceRecord = function(stuId) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === stuId);
      if (!s) return;
      const prevPaid = Number(s.amountPaid) || 0;
      const newFee = Math.max(0, parseFloat(document.getElementById("finFee").value) || 0);
      const newPaid = Math.max(0, parseFloat(document.getElementById("finPaid").value) || 0);

      s.name = document.getElementById("finName").value.trim() || s.name;
      s.parentPhone = document.getElementById("finPhone").value.trim();
      s.level = Number(document.getElementById("finLevel").value) || s.level;
      s.coachName = document.getElementById("finCoach").value.trim() || "Coach Abdelrahman";
      s.courseFee = newFee;
      s.amountPaid = newPaid;
      s.remaining = Math.max(0, newFee - newPaid);

      if (newPaid > prevPaid) {
        const diff = newPaid - prevPaid;
        if (s.lastPayDate === todayISO()) {
          s.lastPayAmount = (Number(s.lastPayAmount) || 0) + diff;
        } else {
          s.lastPayDate = todayISO();
          s.lastPayAmount = diff;
        }
      }
      save();
      window.finSubTab = "analytics";
      render();
      toast(`✅ تم تحديث حساب الطالب (${s.stuCode}) — المتبقي: ${s.remaining} EGP`);
    };

      const csv = "\ufeff" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
