<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="img/eca-mark.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ECA Chess" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>(function(){try{var t=localStorage.getItem("ECA_THEME")==="light"?"light":"dark";var d=document.documentElement;d.classList.remove("dark","light");d.classList.add(t);}catch(e){}})();</script>
  <title>Egypt Chess Academy (ECA) — Full Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050507; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .font-display { font-family: 'Cinzel', serif; }
    .gold-gradient-text { background: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #997415 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-card { background: rgba(14, 14, 21, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65); }
    .gold-btn { background: linear-gradient(135deg, #f3d266 0%, #d4af37 100%); color: #050507; font-weight: 700; }
    .gold-btn:hover { filter: brightness(1.08); }

    /* ===== ECA additions: mobile, attendance, light theme ===== */
    body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
    header.sticky { padding-top: env(safe-area-inset-top); }
    @media (max-width: 640px) {
      #navButtons { width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
      #navButtons > button { white-space: nowrap; flex: 0 0 auto; }
      input, select, textarea { font-size: 16px !important; }
    }
    .att-btn { min-height: 42px; min-width: 66px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #18181b; color: #d1d5db; border: 1px solid rgba(212,175,55,.25); }
    .att-p.on { background: #10b981 !important; color: #04170f !important; border-color: #10b981 !important; }
    .att-l.on { background: #f59e0b !important; color: #1a1000 !important; border-color: #f59e0b !important; }
    .att-a.on { background: #ef4444 !important; color: #ffffff !important; border-color: #ef4444 !important; }
    .tap { min-height: 40px; }
    .g-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px; background: #fff; color: #1f1f1f; font-size: 13px; font-weight: 700; border: 1px solid #dadce0; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: background .15s; }
    .g-btn:hover { background: #f1f3f4; }
    html.light .g-btn, html.light .g-btn * { color: #1f1f1f !important; }

    /* ===== ساحة التدريب: الرقعة ===== */
    .eca-board { direction: ltr; width: 100%; max-width: 520px; aspect-ratio: 1 / 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 14px; overflow: hidden; border: 2px solid rgba(212,175,55,.55); box-shadow: 0 10px 30px rgba(0,0,0,.5); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .eca-sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .eca-sq.l { background: var(--sq-l, #f0d9b5); } .eca-sq.d { background: var(--sq-d, #b58863); }
    .eval-bar { direction: ltr; height: 14px; border-radius: 999px; overflow: hidden; background: #1a1410; border: 1px solid rgba(212,175,55,.45); }
    .eval-bar > div { height: 100%; background: linear-gradient(90deg, #fffdf5, #f3e7c4); transition: width .35s ease; }
    .eca-tile { transition: transform .15s ease, border-color .15s ease; }
    .eca-tile:hover { transform: translateY(-3px); border-color: rgba(250,204,21,.8); }
    .badge-off { filter: grayscale(1); opacity: .35; }
    details.faq > summary { list-style: none; cursor: pointer; }
    details.faq > summary::-webkit-details-marker { display: none; }
    details.faq[open] .faq-ic { transform: rotate(180deg); }
    .eca-sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(212,175,55,.45); }
    .eca-sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(255,215,64,.7); }
    .eca-sq.hint::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px #10b981; }
    .eca-sq.good::before { content: ""; position: absolute; inset: 0; background: rgba(16,185,129,.6); }
    .eca-sq.bad::before { content: ""; position: absolute; inset: 0; background: rgba(239,68,68,.65); }
    .eca-sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(239,68,68,.95) 0%, rgba(239,68,68,.35) 55%, transparent 75%); }
    .eca-sq.mv::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(5,5,7,.32); }
    .eca-sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 5px solid rgba(5,5,7,.32); }
    .eca-pc { position: relative; z-index: 1; font-size: clamp(24px, 9.2vw, 54px); line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", sans-serif; pointer-events: none; }
    .eca-pc.w { color: #fffdf5; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000, 0 2px 3px rgba(0,0,0,.45); }
    .eca-pc.b { color: #1a1410; text-shadow: 0 0 1px #f5e7c3, 0 1px 2px rgba(0,0,0,.4); }
    .eca-co { position: absolute; z-index: 2; font-size: 10px; font-weight: 700; pointer-events: none; }
    .eca-co.f { right: 3px; bottom: 1px; } .eca-co.r { left: 3px; top: 1px; }
    .eca-sq.l .eca-co { color: #b58863; } .eca-sq.d .eca-co { color: #f0d9b5; }
    .vis-target { font-family: 'Cinzel', serif; font-size: 64px; font-weight: 800; line-height: 1; }
    @keyframes ecaPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .eca-pop { animation: ecaPop .18s ease-out; }
    html.light body { background-color: #f6f3ea; color: #1f2937; }
    html.light #bgCanvas { opacity: .6; }
    html.light .gold-card { background: rgba(255,255,255,.94); border-color: rgba(153,116,21,.35); box-shadow: 0 6px 22px rgba(60,45,10,.12); }
    html.light .gold-gradient-text { background: linear-gradient(135deg,#7a5a07 0%,#b8860b 50%,#6b4f0a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    html.light [class*="bg-black"] { background-color: #ffffff !important; }
    html.light .fixed.inset-0[class*="bg-black"] { background-color: rgba(20,15,5,.55) !important; }
    html.light .bg-zinc-900 { background-color: #efe9d8 !important; }
    html.light .bg-zinc-800 { background-color: #e3dabf !important; }
    html.light .border-zinc-800 { border-color: #d9cfae !important; }
    html.light .text-white { color: #111827 !important; }
    html.light .text-gray-300 { color: #374151 !important; }
    html.light .text-gray-400 { color: #4b5563 !important; }
    html.light .text-gray-500 { color: #6b7280 !important; }
    html.light .text-yellow-300, html.light .text-yellow-400 { color: #7a5a07 !important; }
    html.light .text-emerald-300, html.light .text-emerald-400 { color: #047857 !important; }
    html.light .text-amber-300 { color: #b45309 !important; }
    html.light .text-red-300 { color: #b91c1c !important; }
    html.light .text-sky-400 { color: #0369a1 !important; }
    html.light .bg-emerald-950\/30 { background-color: #ecfdf5 !important; }
    html.light .bg-amber-950\/40 { background-color: #fffbeb !important; }
    html.light .att-btn { background: #efe9d8; color: #374151; }
    html.light .gold-btn, html.light .gold-btn * { color: #050507 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- Animated Gold Particles Background -->
  <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-zinc-900 border border-yellow-500 text-yellow-300 px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold"></div>

  <!-- Level Up Test Modal -->
  <div id="examModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="gold-card rounded-2xl max-w-lg w-full p-6">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-display font-bold text-lg text-yellow-400" id="examTitle">🏆 Level Promotion Test</h3>
        <button onclick="closeExamModal()" class="text-gray-400 hover:text-white">✕</button>
      </div>
      <div id="examBody"></div>
    </div>
  </div>


  <!-- Add / Edit Student Modal -->
  <div id="addStuModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <form onsubmit="saveStudent(event)" class="gold-card rounded-2xl max-w-lg w-full p-5 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg text-yellow-400">
          <span id="asTitleNew">➕ إضافة طالب جديد</span><span id="asTitleEdit" class="hidden">✏️ تعديل بيانات الطالب</span>
        </h3>
        <button type="button" onclick="closeAddStu()" class="text-gray-400 hover:text-white tap px-2">✕</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <input id="asName" required placeholder="اسم الطالب بالكامل" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asUser" placeholder="اليوزر نيم بالإنجليزي (اختياري)" autocapitalize="none" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asPass" placeholder="كلمة السر (6+ حروف) — سيبها فاضية لتوليد تلقائي" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asAge" type="number" min="3" max="99" inputmode="numeric" placeholder="السن" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asPhone" type="tel" inputmode="tel" placeholder="موبايل الطالب" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <input id="asParent" type="tel" inputmode="tel" placeholder="موبايل ولي الأمر (واتساب)" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-white" />
        <select id="asLevel" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300"></select>
        <select id="asGroup" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300"></select>
        <select id="asMode" class="sm:col-span-2 w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300">
          <option value="offline">🏫 طالب أوفلاين (حضوري)</option>
          <option value="online">💻 طالب أونلاين</option>
        </select>
      </div>
      <p id="asEditHint" class="hidden text-[11px] text-gray-400 mt-2">اترك الباسورد فارغاً لو مش عايز تغيّره.</p>
      <div class="flex flex-wrap justify-between items-center gap-2 mt-4">
        <button id="asDelBtn" type="button" onclick="deleteStudent()" class="hidden tap px-4 rounded-xl text-xs bg-red-500/20 text-red-300 border border-red-500/30">🗑️ حذف الطالب</button>
        <div class="flex gap-2 mr-auto">
          <button type="button" onclick="closeAddStu()" class="tap px-4 rounded-xl text-xs bg-zinc-800 text-gray-300">إلغاء</button>
          <button class="tap px-5 rounded-xl text-xs gold-btn"><span id="asSubNew">إضافة الطالب ✅</span><span id="asSubEdit" class="hidden">حفظ التعديلات ✅</span></button>
        </div>
      </div>
    </form>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 gold-card border-b border-yellow-500/20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div onclick="goHomeRefresh()" class="flex items-center gap-3 cursor-pointer select-none">
        <img src="img/eca-mark.png" alt="ECA" width="48" height="48" class="w-12 h-12 rounded-xl bg-white border-2 border-yellow-500 object-contain shadow-lg" />
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display font-extrabold text-lg md:text-xl gold-gradient-text">EGYPT CHESS ACADEMY</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">ECA</span>
          </div>
          <p dir="ltr" class="text-[11px] text-gray-400 tracking-widest">WHERE MINDS, GROW STRONGER</p>
        </div>
      </div>

      <!-- Coach Search Bar in Header -->
      <div id="coachSearchBox" class="hidden flex-1 max-w-md mx-2">
        <div class="relative flex items-center">
          <input id="coachTopSearch" oninput="coachSearchStudent(this.value)" type="text" placeholder="🔍 Search student username..." class="w-full bg-black/90 border border-yellow-500/40 rounded-xl pl-3 pr-24 py-2 text-xs text-white" />
          <button onclick="switchTab('tracker')" class="absolute right-1.5 gold-btn text-[11px] px-2.5 py-1 rounded-lg">Follow Up</button>
        </div>
      </div>

      <button id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-yellow-500/40 text-yellow-300">☀️</button>
      <button id="installBtn" onclick="installApp()" class="hidden px-3 py-1.5 rounded-xl text-xs font-bold gold-btn">📲 تثبيت التطبيق</button>
      <button id="langBtn" onclick="toggleLang()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 border border-yellow-500/40 text-yellow-300">EN</button>
      <div id="navButtons" class="flex items-center gap-2 flex-wrap"></div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="mainView" class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <!-- Fallback visible immediately -->
    <div class="gold-card rounded-2xl p-6 text-center text-yellow-300">جاري تحميل منصة Egypt Chess Academy...</div>
  </main>

  <!-- FOOTER -->
  <footer id="ecaFooter" class="relative z-10 gold-card border-t border-yellow-500/20 mt-8"></footer>

    async function parentLookup() {

      const r = await window.fbParentLookup(code);
      parentBusy = false;
      if (!r.ok) { parentStu = null; render(); return toast("❌ الكود غير صحيح أو انتهت صلاحيته"); }

    // ================= ECA ADDITIONS: students, attendance, backup, theme, PWA =================
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    function stuMode(s) { return s.mode === "online" ? "online" : "offline"; }
    function isCoach() { const u = currUser(); return !!(u && u.role === "coach"); }
    function waLink(num) { let d = String(num || "").replace(/\D/g, ""); if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "20" + d.slice(1); return "https://wa.me/" + d; }
    function dl(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
    function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

    let attDate = todayISO(), attMode = "offline", attQ = "", attMonth = todayISO().slice(0, 7);
    const ATT_LABEL = { p: "حاضر", l: "متأخر", a: "غايب" };
    function stuAttStats(id, month) {
      let p = 0, l = 0, a = 0;
      for (const d in db.attendance) {
        if (month && !d.startsWith(month)) continue;
        const v = db.attendance[d][id];

      const name = g("asName"); if (!name) return toast("❌ اكتب اسم الطالب");

      if (!username) username = "eca_" + String(Date.now()).slice(-6);

      { match: /mate|mating/i, q: (t) => `In "${t}", what is the primary objective to finish the game immediately?`, opts: ["Deliver a forced Checkmate net", "Trade all pawns", "Move the King to the corner"], ans: 0 },
      { match: /pin/i, q: (t) => `In "${t}", how do you maximize pressure on a pinned piece?`, opts: ["Attack it with a pawn or another piece (Pile up)", "Immediately retreat your pieces", "Offer a draw"], ans: 0 },
      { match: /double attack|twofold|fork/i, q: (t) => `In "${t}", what makes a double attack winning?`, opts: ["Creating two simultaneous threats the opponent cannot both defend", "Moving the same piece twice", "Trading Queens early"], ans: 0 },
      { match: /discovered|x-ray/i, q: (t) => `In "${t}", how do you make a discovered attack most devastating?`, opts: ["Move the front piece with a direct check or tempo threat", "Put the King in the center", "Pass the turn"], ans: 0 },
      { match: /defend|defence|eliminat/i, q: (t) => `In "${t}", what is the fastest way to break a strong defense?`, opts: ["Eliminate, capture, or lure away the key defending piece", "Wait passively", "Push flank pawns randomly"], ans: 0 },
      { match: /pawn|breakthrough|square|passed/i, q: (t) => `In "${t}", what is the key strategic goal in pawn play?`, opts: ["Create an unstoppable passed pawn and control key promotion squares", "Keep all pawns on the 2nd rank", "Give up the center"], ans: 0 },
      { match: /rook|seventh|open file/i, q: (t) => `In "${t}", how should Rooks be activated for maximum power?`, opts: ["Seize open files and penetrate to the 7th rank", "Keep Rooks locked behind unmoved pawns", "Trade Rooks for single pawns"], ans: 0 },
      { match: /draw|stalemate|wrong bishop/i, q: (t) => `In "${t}", when you are down material in the endgame, what resource can save the game?`, opts: ["Aim for Stalemate, perpetual check, or a theoretical draw fortress", "Resign immediately", "Expose the King to checks"], ans: 0 },
      { match: /opening|golden rules|castl/i, q: (t) => `In "${t}", what are the 3 Golden Rules of the opening?`, opts: ["Control the center, develop pieces quickly, and castle the King safely", "Bring the Queen out on move 2 and push all edge pawns", "Move only Knights"], ans: 0 }
    ];

    function buildLessonQuestion(lessonObj, idx, seedNum) {
      const title = lessonObj.t;
      const url = (lessonObj.l && lessonObj.l[0] && lessonObj.l[0][1]) ? lessonObj.l[0][1] : "https://lichess.org/training";
      let pat = LESSON_QUESTION_PATTERNS.find(p => p.match.test(title));
      let baseQ = pat ? pat.q(title) : `Tactical Evaluation — Lesson "${title}": Choose the most accurate chess principle:`;
      let rawOpts = pat ? [...pat.opts] : [
        `Apply the core tactical motif of "${title}" with calculation`,
        "Play a passive waiting move without a plan",
        "Give up material without compensation"
      ];
      // تبديل أماكن الاختيارات عشوائياً بناءً على البذرة (Seed) لضمان عدم حفظ المكان
      const shift = (seedNum + idx) % 3;
      const rotated = [0, 1, 2].map(i => ({ text: rawOpts[(i + shift) % 3], isCorrect: ((i + shift) % 3) === 0 }));
      return {
        lessonTitle: title,
        url: url,
        q: baseQ,
        opts: rotated.map(r => r.text),
        ans: rotated.findIndex(r => r.isCorrect)
      };
    }

    // 3. تحديث اللغز اليومي تلقائياً كل يوم بناءً على دروس كل Step (الشرط رقم 6)
    function updateDailyPuzzlesByDate() {
      const dayKey = todayISO(); // YYYY-MM-DD
      const dayHash = dayKey.split("-").reduce((acc, v) => acc + parseInt(v, 10) * 31, 7);
      STEPS.forEach(st => {
        if (st.lessons && st.lessons.length > 0) {
          const lessonIdx = dayHash % st.lessons.length;
          const les = st.lessons[lessonIdx];
          const generated = buildLessonQuestion(les, lessonIdx, dayHash);
          PUZZLES[st.step] = {
            q: `[لغز اليوم ${dayKey} — درس: ${les.t}] ${generated.q}`,
            opts: generated.opts,
            ans: generated.ans,
            url: generated.url,
            dayKey: dayKey
          };
        }
      });
    }

    // فتح اللغز اليومي تلقائياً عندما يتغير اليوم
    function ensureDailyPuzzleFreshForUser(u) {
      updateDailyPuzzlesByDate();
      if (!u || u.role !== "student") return;
      const dayKey = todayISO();
      if (u.lastPuzDate !== dayKey) {
        u.lastPuzDate = dayKey;
        u.puzDone = {};
      }
    }

    // 4. تعديل عرض صفحة الطالب لفرض شروط الامتحان وإظهار الشهادات وطلب الإعادة
    const _origRenderStudentHome = renderStudentHome;
    renderStudentHome = function(stu) {
      ensureDailyPuzzleFreshForUser(stu);
      const html = _origRenderStudentHome(stu);
      const s = calcStats(stu);
      const stepNum = Number(stu.level);
      const exState = (stu.examState && stu.examState[stepNum]) || null; // { status: 'failed'|'passed', score: %, reqRetry: bool }
      const certs = stu.certificates || [];

      let examActionHtml = "";
      if (s.attP < 100) {
        examActionHtml = `
          <div class="mt-4 pt-3 border-t border-yellow-500/20 flex flex-wrap justify-between items-center gap-2">
            <span class="text-xs text-amber-300">🔒 يُفتح اختبار الترقية تلقائياً عند إتمام حضور 100% من دروس Step ${stepNum} (متبقي ${s.rem} درس)</span>
            <button disabled class="px-4 py-2 rounded-xl text-xs bg-zinc-800 text-gray-500 cursor-not-allowed">🔒 مقفول (${s.attP}%)</button>
          </div>`;
      } else if (exState && exState.status === "failed") {
        examActionHtml = `
          <div class="mt-4 pt-3 border-t border-red-500/30 flex flex-wrap justify-between items-center gap-2">
            <span class="text-xs text-red-300">❌ لم تجتز الاختبار (${exState.score}% — المطلوب 70%). مسموح بمحاولة واحدة فقط.</span>
            ${exState.reqRetry 
              ? `<span class="px-3 py-1.5 rounded-xl text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40">⏳ تم إرسال طلب الإعادة للكوتش وبانتظار الموافقة</span>`
              : `<button onclick="requestExamRetry()" class="px-4 py-2 rounded-xl text-xs gold-btn">📩 إرسال طلب إعادة الاختبار للكوتش</button>`
            }
          </div>`;
      } else {
        examActionHtml = `
          <div class="mt-4 pt-3 border-t border-yellow-500/20 flex flex-wrap justify-between items-center gap-2">
            <span class="text-xs text-emerald-300 font-bold">✅ أتممت 100% من الحضور! اختبار الترقية متاح الآن (محاولة واحدة - النجاح من 70%):</span>
            <button onclick="openExamModal(${stepNum})" class="px-4 py-2 rounded-xl text-xs gold-btn">📝 بدء اختبار Step ${stepNum} الشامل</button>
          </div>`;
      }

      // استبدال جزء زر الاختبار القديم بالجزء الذكي الجديد
      const replaced = html.replace(
        /<div class="mt-4 pt-3 border-t border-yellow-500\/20 flex justify-between items-center">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>\s*<\/div>$/,
        examActionHtml + `</div></div>` + (certs.length ? renderStudentCertificatesBox(stu) : "") + `</div>`
      );
      return replaced;
    };

    function renderStudentCertificatesBox(stu) {
      const certs = stu.certificates || [];
      return `
        <div class="gold-card rounded-2xl p-6 mt-6">
          <h3 class="font-display font-bold text-lg text-yellow-400 mb-3">🎓 شهادات التقدير المعتمدة (ECA Certificates)</h3>
          <div class="grid sm:grid-cols-2 gap-4">
            ${certs.map((c, idx) => `
              <div class="p-4 rounded-xl bg-black/80 border border-yellow-500/40 flex flex-wrap justify-between items-center gap-3">
                <div>
                  <div class="text-sm font-bold text-white">🏆 شهادة إتمام Step ${c.step}</div>
                  <div class="text-xs text-gray-400">النتيجة: ${c.score}% • المدرب: ${esc(c.coachName)} •${c.date}</div>
                </div>
                <div class="flex gap-2">
                  <button onclick="previewAndDownloadCert('${stu.id}',${idx}, false)" class="px-3 py-1.5 rounded-xl text-xs gold-btn">📄 تحميل PDF</button>
                  <button onclick="previewAndDownloadCert('${stu.id}',${idx}, true)" class="px-3 py-1.5 rounded-xl text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">💬 إرسال لواتساب ولي الأمر</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }

    // 5. طلب إعادة الاختبار وموافقة الكوتش (الشرط رقم 5)
    window.requestExamRetry = function() {
      const u = currUser(); if (!u) return;
      u.examState = u.examState || {};
      const st = Number(u.level);
      if (u.examState[st]) {
        u.examState[st].reqRetry = true;
        save(); render();
        toast("📩 تم إرسال طلب إعادة الاختبار للمدرب المسؤول");
      }
    };

    window.approveExamRetry = function(stuId, stepNum) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === stuId); if (!s) return;
      if (s.examState && s.examState[stepNum]) {
        delete s.examState[stepNum];
      }
      save(); render();
      toast("✅ تمت الموافقة على إعادة الاختبار للطالب " + s.name);
    };

    window.assignStudentCoach = function(stuId, coachName) {
      if (!isCoach()) return;
      const s = db.users.find(u => u.id === stuId); if (!s) return;
      s.coachName = coachName.trim();
      save(); toast("✅ تم تحديث اسم المدرب المسؤول عن الطالب");
    };

    // إضافة إشعار طلبات إعادة الاختبار وخانة اسم المدرب في لوحة تحكم المدرب
    const _origRenderTrackerView = renderTrackerView;
    renderTrackerView = function() {
      const baseHtml = _origRenderTrackerView();
      const students = db.users.filter(u => u.role === "student");
      const retryRequests = [];
      students.forEach(s => {
        if (s.examState) {
          Object.keys(s.examState).forEach(stKey => {
            const inf = s.examState[stKey];
            if (inf && inf.status === "failed" && inf.reqRetry) {
              retryRequests.push({ stu: s, step: stKey, score: inf.score });
            }
          });
        }
      });

      const retryBanner = retryRequests.length ? `
        <div class="gold-card rounded-2xl p-4 mb-5 border-2 border-amber-500/60 bg-amber-950/20">
          <h3 class="font-bold text-sm text-yellow-300 mb-2">🔔 طلبات إعادة اختبار الترقية بانتظار موافقتك (${retryRequests.length}):</h3>
          <div class="space-y-2">
            ${retryRequests.map(r => `
              <div class="flex flex-wrap justify-between items-center gap-2 p-2.5 rounded-xl bg-black/80 border border-yellow-500/30 text-xs">
                <span class="text-white font-bold">${esc(r.stu.name)} (@${esc(r.stu.username)}) — Step${r.step} <span class="text-red-300">(الدرجة السابقة: ${r.score}%)</span></span>
                <button onclick="approveExamRetry('${r.stu.id}', '${r.step}')" class="px-3 py-1.5 rounded-xl text-xs gold-btn">✓ الموافقة على إعادة الاختبار</button>
              </div>
            `).join("")}
          </div>
        </div>` : "";

      // نفس الطالب المختار في الجدول الأساسي (مع مراعاة الفلتر والبحث)
      const q = searchQ.toLowerCase();
      const filtered = students.filter(s => (grpFilter === "ALL" || s.group === grpFilter) && (!q || String(s.name || "").toLowerCase().includes(q) || String(s.username || "").toLowerCase().includes(q)));
      const sel = students.find(s => s.id === selStuId) || filtered[0] || null;
      let extraCoachControls = "";
      if (sel) {
        const curCoach = sel.coachName || (currUser() && currUser().name) || "الكوتش عبدالرحمن منصور";
        const certs = sel.certificates || [];
        extraCoachControls = `
          <div class="gold-card rounded-2xl p-4 mt-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2 flex-1">
              <span class="text-xs text-yellow-300 font-bold">👨‍🏫 اسم الكوتش في شهادة الطالب (${esc(sel.name)}):</span>
              <input id="stuCoachInp" value="${esc(curCoach)}" onchange="assignStudentCoach('${sel.id}', this.value)" class="bg-black border border-yellow-500/40 rounded-xl px-3 py-1.5 text-xs text-white" />
            </div>
            ${certs.length ? `<button onclick="previewAndDownloadCert('${sel.id}',${certs.length - 1}, true)" class="px-3 py-1.5 rounded-xl text-xs gold-btn">🎓 إرسال آخر شهادة لولي الأمر PDF</button>` : ""}
          </div>`;
      }

      return retryBanner + baseHtml + extraCoachControls;
    };

    // 6. نظام الاختبار التفاعلي الشامل (لغز من كل درس + نجاح من 70% + محاولة واحدة)
    let activeExam = null;
    openExamModal = function(lvl) {
      const u = currUser();
      if (!u || u.role !== "student") return;
      const stepNum = Number(lvl);
      const stats = calcStats(u);

      if (stats.attP < 100) {
        return toast("🔒 يجب إتمام حضور 100% من دروس هذا المستوى أولاً لفتح الاختبار!");
      }
      u.examState = u.examState || {};
      if (u.examState[stepNum] && u.examState[stepNum].status === "failed") {
        return toast("❌ استنفدت محاولتك في هذا الاختبار. اطلب إعادة الاختبار من المدرب.");
      }

      const stObj = STEPS.find(x => x.step === stepNum);
      if (!stObj || !stObj.lessons || stObj.lessons.length === 0) {
        return toast("لا توجد دروس مسجلة في هذا المستوى حالياً");
      }

      const seed = Date.now() % 997;
      const questions = stObj.lessons.map((les, idx) => buildLessonQuestion(les, idx, seed));
      activeExam = { step: stepNum, questions, answers: {} };

      const modal = document.getElementById("examModal");
      modal.classList.remove("hidden");
      renderActiveExamUI();
    };

    function renderActiveExamUI() {
      if (!activeExam) return;
      const total = activeExam.questions.length;
      const answeredCount = Object.keys(activeExam.answers).length;
      document.getElementById("examTitle").innerHTML = `🏆 اختبار ترقية Step ${activeExam.step} (${answeredCount}/${total} سؤال)`;
      document.getElementById("examBody").innerHTML = `
        <div class="text-xs text-gray-300 mb-3 p-2.5 rounded-xl bg-black/70 border border-yellow-500/30">
          ⚠️ <b>تعليمات الاختبار:</b> يتكون الاختبار من <b>${total} لغز</b> (سؤال من كل درس في Step ${activeExam.step}). النجاح يتطلب <b>70% فأكثر</b> للترقية التلقائية وإصدار الشهادة. متاح لك <b>محاولة واحدة فقط</b>.
        </div>
        <div class="space-y-4 max-h-[55vh] overflow-y-auto pr-1">
          ${activeExam.questions.map((qObj, qIdx) => `
            <div class="p-3.5 rounded-xl bg-black/80 border border-yellow-500/25 space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-yellow-400">لغز درس #${qIdx + 1}:${esc(qObj.lessonTitle)}</span>
                <a href="${qObj.url}" target="_blank" class="text-[11px] text-sky-400 hover:underline">معاينة الرقعة ↗</a>
              </div>
              <p class="text-xs text-white font-medium">${esc(qObj.q)}</p>
              <div class="space-y-1.5">
                ${qObj.opts.map((optTxt, oIdx) => {
                  const chosen = activeExam.answers[qIdx] === oIdx;
                  return `
                    <button type="button" onclick="selectExamAns(${qIdx}, ${oIdx})" class="w-full text-left px-3 py-2 rounded-lg text-xs border transition flex justify-between items-center ${chosen ? 'border-yellow-400 bg-yellow-500/20 text-yellow-200 font-bold' : 'border-zinc-800 bg-zinc-900/80 text-gray-300 hover:border-yellow-500/40'}">
                      <span>${esc(optTxt)}</span>
                      <span>${chosen ? '●' : '○'}</span>
                    </button>`;
                }).join("")}
              </div>
            </div>
          `).join("")}
        </div>
        <div class="mt-4 pt-3 border-t border-yellow-500/20 flex justify-between items-center">
          <span class="text-xs text-gray-400">أجبت على ${answeredCount} من ${total}</span>
          <button type="button" onclick="submitFullStepExam()" class="px-5 py-2.5 rounded-xl text-xs gold-btn">تسليم الاختبار والنتيجة النهائية 🚀</button>
        </div>
      `;
    }
window.selectExamAns = function(qIdx, oIdx) {
   if (!activeExam) return;
   const box = document.querySelector("#examBody .overflow-y-auto");
   const prevTop = box ? box.scrollTop : 0;
   activeExam.answers[qIdx] = oIdx;
   renderActiveExamUI();
   const newBox = document.querySelector("#examBody .overflow-y-auto");
   if (newBox) newBox.scrollTop = prevTop;
 };

    window.submitFullStepExam = async function() {
      if (!activeExam) return;
      const total = activeExam.questions.length;
      if (Object.keys(activeExam.answers).length < total) {
        return toast("⚠️ يرجى الإجابة على جميع أسئلة الدروس قبل التسليم!");
      }
      let correct = 0;
      activeExam.questions.forEach((qObj, idx) => {
        if (activeExam.answers[idx] === qObj.ans) correct++;
      });
      const score = Math.round((correct / total) * 100);
      const u = currUser(); if (!u) return;
      const oldStep = activeExam.step;
      u.examState = u.examState || {};

      if (score >= 70) {
        u.examState[oldStep] = { status: "passed", score: score, date: todayISO() };
        const coachUser = db.users.find(x => x.role === "coach");
        const coachName = u.coachName || (coachUser ? coachUser.name : "الكوتش عبدالرحمن منصور");
        u.certificates = u.certificates || [];
        u.certificates.push({
          step: oldStep,
          score: score,
          studentName: u.name,
          coachName: coachName,
          date: todayISO()
        });
        const newLevel = Math.min(6, oldStep + 1);
        u.level = newLevel;
        save();
        closeExamModal();
        render();
        toast(`🎉 مبروك! نجحت بنسبة ${score}% وتمت ترقيتك إلى Step ${newLevel}`);
        // توليد الشهادة وعرض نافذة الإرسال لولي الأمر فوراً
        setTimeout(() => {
          previewAndDownloadCert(u.id, u.certificates.length - 1, true);
        }, 400);
      } else {
        u.examState[oldStep] = { status: "failed", score: score, reqRetry: false, date: todayISO() };
        save();
        closeExamModal();
        render();
        toast(`❌ حصلت على ${score}% (المطلوب 70%). تم قفل الاختبار ويمكنك طلب إعادة الاختبار من المدرب.`);
      }
    };

// 7. رسم الشهادة وعرضها في نافذة معاينة مع طباعة PDF وتنزيل مباشر مضمون 100%
    window.buildCertificateDataURL = async function(cert) {
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (_) {}
      }
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 1130;
      const c = canvas.getContext("2d");

      // خلفية كريمي مطابقة للشهادة الرسمية
      c.fillStyle = "#faf3e3";
      c.fillRect(0, 0, canvas.width, canvas.height);

      // الإطار الخارجي والداخلي
      c.strokeStyle = "#1b2420";
      c.lineWidth = 14;
      c.strokeRect(36, 36, canvas.width - 72, canvas.height - 72);

      c.strokeStyle = "#c59b27";
      c.lineWidth = 4;
      c.strokeRect(58, 58, canvas.width - 116, canvas.height - 116);

      // علامة مائية خفيفة
      c.save();
      c.globalAlpha = 0.05;
      c.fillStyle = "#1b2420";
      c.font = "900 160px Cinzel, serif";
      c.textAlign = "center";
      c.fillText("ECA CHESS", canvas.width / 2, canvas.height / 2 + 40);
      c.restore();

      // العنوان العلوي: EGYPT CHESS ACADEMY (ECA)
      c.fillStyle = "#9a7418";
      c.font = "800 32px Cinzel, serif";
      c.textAlign = "center";
      c.fillText("EGYPT CHESS ACADEMY (ECA)", canvas.width / 2, 145);

      // شهادة تقدير
      c.fillStyle = "#18221f";
      c.font = "900 90px Cairo, sans-serif";
      c.fillText("شهادة تقدير", canvas.width / 2, 270);

      // خط زخرفي
      c.strokeStyle = "#c59b27";
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(canvas.width / 2 - 220, 310);
      c.lineTo(canvas.width / 2 + 220, 310);
      c.stroke();

      // تمنح هذه الشهادة للمتدرب
      c.fillStyle = "#4b5563";
      c.font = "700 34px Cairo, sans-serif";
      c.fillText("تمنح هذه الشهادة للمتدرب", canvas.width / 2, 390);

      // اسم الطالب
      c.fillStyle = "#b07d12";
      c.font = "900 64px Cairo, sans-serif";
      c.fillText(cert.studentName, canvas.width / 2, 490);

      // نص التقدير
      c.fillStyle = "#1f2937";
      c.font = "600 30px Cairo, sans-serif";
      c.fillText(`تقديراً لأدائه الرائع والتزامه المتميز في التدريبات الشطرنجية، واجتيازه مستوى (Step ${cert.step}) بنسبة ${cert.score}%،`, canvas.width / 2, 580);
      c.fillText("ونتمنى له دوام التقدم والتفوق في رحلته مع الشطرنج.", canvas.width / 2, 640);

      // التوقيعات السفلية: المدرب (يمين) - الشعار (منتصف) - إدارة الأكاديمية (يسار)
      c.fillStyle = "#18221f";
      c.font = "800 34px Cairo, sans-serif";
      c.fillText(cert.coachName, 1220, 855);
      c.strokeStyle = "#9ca3af";
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(1040, 880); c.lineTo(1400, 880); c.stroke();
      c.fillStyle = "#6b7280";
      c.font = "700 26px Cairo, sans-serif";
      c.fillText("المدرب", 1220, 925);

      // الشعار في المنتصف
      c.beginPath();

      c.lineWidth = 5;
      c.strokeStyle = "#d4af37";

      c.fillStyle = "#d4af37";
      c.font = "800 34px Cinzel, serif";
      c.fillText("ECA", canvas.width / 2, 875);

      c.fillText("EGYPT CHESS ACADEMY (ECA)", 380, 855);
      c.beginPath(); c.moveTo(200, 880); c.lineTo(560, 880); c.stroke();
      c.fillStyle = "#6b7280";

      // التاريخ
      c.fillStyle = "#9ca3af";
      c.font = "600 20px Inter, sans-serif";
      c.fillText(`Issued on: ${cert.date} • Official ECA Certificate`, canvas.width / 2, 1035);

      return canvas.toDataURL("image/png");
    };

    window.previewAndDownloadCert = async function(stuId, certIdx, openWaAfter) {

        `إشراف المدرب: ${cert.coachName}\n` +

      certModal.innerHTML = `

            <h3 class="font-display font-bold text-lg text-yellow-400">🎓 شهادة تقدير — ${esc(cert.studentName)} (Step ${cert.step})</h3>
            <button onclick="document.getElementById('certPreviewModal').classList.add('hidden')" class="text-gray-400 hover:text-white px-2 text-lg">✕</button>
          </div>
          <div class="rounded-xl overflow-hidden border-2 border-yellow-500/50 bg-black">
            <img id="certPreviewImg" src="${dataUrl}" alt="ECA Certificate" class="w-full h-auto block" />
          </div>
          <div class="flex flex-wrap justify-end gap-2 pt-2">
            <button onclick="printCertAsPDF()" class="px-4 py-2.5 rounded-xl text-xs gold-btn">🖨️ طباعة / حفظ كملف PDF</button>
            <a href="${dataUrl}" download="ECA-Certificate-Step${cert.step}-${stu.username}.png" class="px-4 py-2.5 rounded-xl text-xs bg-zinc-800 border border-yellow-500/40 text-yellow-300 font-bold">📥 تنزيل كصورة جاهزة</a>
            <a href="${waBase}?text=${waMsg}" target="_blank" rel="noopener" class="px-4 py-2.5 rounded-xl text-xs bg-emerald-500 text-black font-bold">💬 إرسال لواتساب ولي الأمر</a>
          </div>
        </div>
      `;

      // إذا ضغط المستخدم على زر التحميل المباشر، نقوم بتنزيل ملف PDF أو الصورة فوراً
      if (!openWaAfter) {
        printCertAsPDF();

    };

    window.printCertAsPDF = function() {
      const img = document.getElementById("certPreviewImg");
      if (!img) return;
      const src = img.src;
      const w = window.open("", "_blank");
      if (!w) {
        // في حال كان المتصفح يمنع النوافذ المنبثقة، نقوم بتنزيلها مباشرة
        const a = document.createElement("a");
        a.href = src;
        a.download = "ECA-Certificate.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        return toast("📥 تم تنزيل الشهادة مباشرة على جهازك!");
      }
      w.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>ECA Official Certificate — Print / Save PDF</title>

            img { width: 100vw; height: 100vh; object-fit: contain; }
          </style>
        </head>

          <img src="${src}" onload="setTimeout(() => { window.print(); }, 250);" />

        </html>
      `);
      w.document.close();
    };

    // تشغيل التوليد اليومي للألغاز فور فتح الموقع
    updateDailyPuzzlesByDate();
  </script>
  <!-- ساحة التدريب: العب ضد الكمبيوتر + ألغاز على الرقعة + تدريب الرؤية -->
  <script>
    const CHESS_JS_URL = "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm";
    const STOCKFISH_URL = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";   // Stockfish.js (GPL)
    const PIECE = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
    const FILES = "abcdefgh";
    const LEVELS = [
      { name: "مبتدئ", desc: "بيلعب نقلات عشوائية كتير — مناسب لأول مرة.", skill: 0, depth: 1, rnd: .5 },
      { name: "متعلّم", desc: "نقلات بسيطة وبيغلط كتير.", skill: 2, depth: 2, rnd: .25 },
      { name: "متدرّب", desc: "بيعرف يستغل الأخطاء الواضحة.", skill: 4, depth: 3, rnd: .1 },
      { name: "منافس", desc: "متوازن — مش سهل ومش صعب.", skill: 6, depth: 5, rnd: 0 },
      { name: "استراتيجي", desc: "بيخطط وبيعمل فخاخ بسيطة.", skill: 9, depth: 7, rnd: 0 },
      { name: "خبير", desc: "بيلعب تكتيك قوي — ركّز.", skill: 12, depth: 9, rnd: 0 },
      { name: "أستاذ", desc: "صعب جداً وبيعاقب على أي غلطة.", skill: 16, depth: 12, rnd: 0 },
      { name: "جراند ماستر", desc: "أقوى مستوى — للأبطال بس.", skill: 20, depth: 15, rnd: 0 }
    ];
    const PUZ_DIFF = [["daily", "🗓️ لغز اليوم من Lichess"], ["easiest", "سهل جداً"],["easier", "سهل"], ["normal", "متوسط"], ["harder", "صعب"], ["hardest", "صعب جداً"]];
    const VIS_SECONDS = 30;

    const arena = {
      sub: "play",
      play: { game: null, level: 1, colorChoice: "w", color: "w", flip: false, sel: null, last: null, thinking: false, over: "" },
      puz: { game: null, sol: [], idx: 0, color: "w", flip: false, sel: null, last: null, flash: null, hint: null, status: "idle", diff: "easier", info: null, counted: false },
      vis: { active: false, target: "", score: 0, left: VIS_SECONDS, timer: null, attempts: [], coords: true, flip: false, flash: null, best: 0 }
    };
    const arenaRefresh = () => { if (tab === "arena") render(); };

    // ---------- تحميل مكتبة الشطرنج (أول مرة بس) ----------
    let ChessCls = null, chessLoading = false;
    function loadChess() {
      if (ChessCls || chessLoading) return;
      chessLoading = true;
      import(CHESS_JS_URL).then(m => { ChessCls = m.Chess; chessLoading = false; arenaRefresh(); })
        .catch(e => { chessLoading = false; console.error(e); toast("📡 تعذّر تحميل مكتبة الشطرنج — اتأكد من الإنترنت"); });
    }

    // ---------- محرك Stockfish (Web Worker) ----------
    let sfWorker = null, sfPending = null, sfBusy = false, sfSkip = 0, sfFailed = false;
    function engine() {
      if (sfWorker || sfFailed) return sfWorker;
      try {
        sfWorker = new Worker(URL.createObjectURL(new Blob([`importScripts("${STOCKFISH_URL}");`], { type: "application/javascript" })));
        sfWorker.onmessage = e => {
          const m = String(e.data).match(/^bestmove\s+(\S+)/); if (!m) return;
          if (sfSkip > 0) { sfSkip--; return; }
          sfBusy = false; const cb = sfPending; sfPending = null; if (cb) cb(m[1]);
        };
        sfWorker.onerror = () => { sfFailed = true; sfWorker = null; sfBusy = false; const cb = sfPending; sfPending = null; if (cb) cb(null); };
        sfWorker.postMessage("uci");
      } catch (_) { sfFailed = true; sfWorker = null; }
      return sfWorker;
    }
    function engineMove(fen, lvl, cb) {
      const w = engine(); if (!w) return cb(null);
      if (sfBusy) { w.postMessage("stop"); sfSkip++; }
      sfBusy = true; sfPending = cb;
      w.postMessage("setoption name Skill Level value " + lvl.skill);
      w.postMessage("position fen " + fen);
      w.postMessage("go depth " + lvl.depth);
    }

    // ---------- الرقعة ----------
    function targetsOf(g, sel) {
      const t = {}; if (!g || !sel) return t;
      g.moves({ square: sel, verbose: true }).forEach(m => { t[m.to] = m.captured ? "cap" : "mv"; });
      return t;
    }
    function boardHTML(o) {
      const g = o.game, b = g ? g.board() : null;
      let chk = null;
      if (g && g.inCheck()) b.forEach(row => row.forEach(p => { if (p && p.type === "k" && p.color === g.turn()) chk = p.square; }));
      let h = `<div class="eca-board mx-auto" dir="ltr">`;
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const rank = o.flip ? r + 1 : 8 - r, file = o.flip ? 7 - c : c, sq = FILES[file] + rank;
        const p = b ? b[8 - rank][file] : null;
        const cls = ["eca-sq", (file + rank) % 2 === 0 ? "d" : "l"];
        if (o.last && o.last.includes(sq)) cls.push("last");
        if (o.sel === sq) cls.push("sel");
        if (o.hint === sq) cls.push("hint");
        if (chk === sq) cls.push("chk");
        if (o.flash && o.flash[sq]) cls.push(o.flash[sq]);
        if (o.targets && o.targets[sq]) cls.push(o.targets[sq]);
        let inner = p ? `<span class="eca-pc ${p.color}">${PIECE[p.type]}&#xFE0E;</span>` : "";
        if (o.coords !== false) {
          if (r === 7) inner += `<span class="eca-co f">${FILES[file]}</span>`;
          if (c === 0) inner += `<span class="eca-co r">${rank}</span>`;
        }
        h += `<div class="${cls.join(" ")}" data-sq="${sq}" onclick="${o.onClick}('${sq}')">${inner}</div>`;
      }
      return h + `</div>`;
    }
    // ضغطة على مربع: يا إما بتختار قطعة، يا إما بتحرّكها
    function pickOrMove(st, sq, myColor) {
      const g = st.game;
      if (st.sel) {
        const mv = g.moves({ square: st.sel, verbose: true }).find(m => m.to === sq);
        if (mv) { const from = st.sel; st.sel = null; return mv.promotion ? { from, to: sq, promotion: "q" } : { from, to: sq }; }
      }
      const p = g.get(sq);
      st.sel = p && p.color === myColor && g.turn() === myColor && st.sel !== sq ? sq : null;
      return null;
    }
    const lastOf = g => { const h = g.history({ verbose: true }); const m = h[h.length - 1]; return m ? [m.from, m.to] : null; };
    function uciMove(g, u) { return g.move(u.length > 4 ? { from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] } : { from: u.slice(0, 2), to: u.slice(2, 4) }); }

    // إحصائيات الطالب بتتحفظ في حسابه (الكوتش بيشوفها في المتابعة)
    function recordArena(fn) {
      const u = currUser(); if (!u || u.role !== "student") return;
      u.arena = u.arena || {}; markActiveDay(u); fn(u.arena); save();
    }
    // أيام التمرين (لشارات الاستمرارية): بنسجّل النهاردة مرة واحدة
    function markActiveDay(u) {
      u.arena = u.arena || {};
      const d = todayISO(), days = u.arena.days = Array.isArray(u.arena.days) ? u.arena.days : [];
      if (!days.includes(d)) { days.push(d); if (days.length > 800) days.splice(0, days.length - 800); }
    }

    // ================= 1) العب ضد الكمبيوتر =================
    function playStart() {
      if (!ChessCls) return;
      const P = arena.play;
      P.game = new ChessCls(); P.over = ""; P.sel = null; P.last = null; P.thinking = false;
      P.color = P.colorChoice === "r" ? (Math.random() < .5 ? "w" : "b") : P.colorChoice;
      P.flip = P.color === "b";
      render();
      if (P.color === "b") playEngine();
    }
    function playClick(sq) {
      const P = arena.play; if (!P.game || P.over || P.thinking) return;
      const mv = pickOrMove(P, sq, P.color);
      if (mv) {
        let r = null; try { r = P.game.move(mv); } catch (_) {}
        if (r) { P.last = [r.from, r.to]; playCheckEnd(); if (!P.over) return playEngine(); }
      }
      arenaRefresh();
    }
    function playEngine() {
      const P = arena.play, g = P.game, lvl = LEVELS[P.level], fen = g.fen(), t0 = Date.now();
      P.thinking = true; arenaRefresh();
      const randomUci = () => { const ms = g.moves({ verbose: true }); const m = ms[Math.floor(Math.random() * ms.length)]; return m.from + m.to + (m.promotion || ""); };
      const apply = uci => {
        if (P.game !== g || g.fen() !== fen) return;                 // دور جديد أو تراجع
        let r = null; try { r = uciMove(g, uci || randomUci()); } catch (_) {}
        if (!r) try { r = uciMove(g, randomUci()); } catch (_) {}
        P.thinking = false; if (r) P.last = [r.from, r.to];
        playCheckEnd(); arenaRefresh();
      };
      const later = uci => setTimeout(() => apply(uci), Math.max(0, 500 - (Date.now() - t0)));
      if (Math.random() < lvl.rnd) later(randomUci()); else engineMove(fen, lvl, later);
    }
    function playCheckEnd() {
      const P = arena.play, g = P.game;
      if (!g.isGameOver()) return;
      P.over = g.isCheckmate() ? (g.turn() === P.color ? "loss" : "win") : "draw";
      P.thinking = false;
      recordArena(a => { a.games = a.games || { w: 0, l: 0, d: 0 }; a.games[P.over[0] === "w" ? "w" : P.over[0] === "l" ? "l" : "d"]++; if (P.over === "win") a.bestWin = Math.max(a.bestWin || 0, P.level + 1); });
      toast(P.over === "win" ? "🏆 كسبت! برافو عليك" : P.over === "loss" ? "😔 الكمبيوتر كسب — جرّب تاني" : "🤝 تعادل");
    }
    function playUndo() {
      const P = arena.play, g = P.game; if (!g || P.thinking || !g.history().length) return;
      g.undo(); if (g.turn() !== P.color && g.history().length) g.undo();
      P.over = ""; P.sel = null; P.last = lastOf(g); arenaRefresh();
    }
    function playResign() {
      const P = arena.play; if (!P.game || P.over) return;
      if (!confirm(trText("متأكد إنك عايز تستسلم؟"))) return;
      P.over = "loss"; P.thinking = false;
      recordArena(a => { a.games = a.games || { w: 0, l: 0, d: 0 }; a.games.l++; });
      arenaRefresh();
    }
    function arenaPlayHTML() {
      const P = arena.play, g = P.game;
      const pill = (v, label) => `<button onclick="arena.play.colorChoice='${v}'; render();" class="flex-1 py-2 rounded-xl text-xs font-bold border ${P.colorChoice === v ? 'border-yellow-400 text-yellow-300 bg-yellow-500/10' : 'border-zinc-800 text-gray-400'}">${label}</button>`;
      const status = !g ? "اختار المستوى واللون واضغط «ابدأ الدور»."
        : P.over === "win" ? "🏆 كسبت الدور!" : P.over === "loss" ? "😔 خسرت الدور" : P.over === "draw" ? "🤝 الدور انتهى بالتعادل"
        : P.thinking ? "🤔 الكمبيوتر بيفكر..." : (g.inCheck() ? "⚠️ كش! " : "") + "دورك — " + (P.color === "w" ? "انت بالأبيض" : "انت بالأسود");
      const hist = g ? g.history() : [];
      let rows = ""; for (let i = 0; i < hist.length; i += 2) rows += `<div class="flex gap-3 px-3 py-1 ${i % 4 === 0 ? 'bg-black/40' : ''}"><span class="w-6 text-gray-500">${i / 2 + 1}.</span><span class="w-16 text-white">${hist[i]}</span><span class="w-16 text-white">${hist[i + 1] || ''}</span></div>`;
      return `
        <div class="grid lg:grid-cols-5 gap-5">
          <div class="min-w-0 lg:col-span-3 gold-card rounded-2xl p-3 sm:p-5">
            ${boardHTML({ game: g || new ChessCls(), flip: P.flip, sel: P.sel, targets: g ? targetsOf(g, P.sel) : null, last: P.last, onClick: "playClick" })}
          </div>
          <div class="min-w-0 lg:col-span-2 space-y-4">
            <div class="gold-card rounded-2xl p-5 space-y-3">
              <div class="text-sm font-bold ${P.over === 'win' ? 'text-emerald-300' : P.over === 'loss' ? 'text-red-300' : 'text-yellow-300'}">${status}</div>
              <label class="block text-xs text-gray-400">مستوى الكمبيوتر</label>
              <select onchange="arena.play.level=+this.value; render();" class="w-full bg-black border border-yellow-500/40 rounded-xl px-3 py-2 text-sm text-yellow-300">
                ${LEVELS.map((l, i) => `<option value="${i}" ${P.level === i ? 'selected' : ''}>${i + 1}. ${l.name}</option>`).join("")}
              </select>
              <p class="text-[11px] text-gray-400">${LEVELS[P.level].desc}</p>
              <div class="flex gap-2">${pill("w", "⚪ أبيض")}${pill("b", "⚫ أسود")}${pill("r", "🎲 عشوائي")}</div>
              <button onclick="playStart()" class="w-full py-3 rounded-xl text-sm gold-btn">${g ? '🔄 دور جديد' : '▶️ ابدأ الدور'}</button>
              ${g ? `<div class="grid grid-cols-3 gap-2">
                <button onclick="playUndo()" class="tap rounded-xl text-xs bg-zinc-900 border border-yellow-500/30 text-yellow-300">↩️ تراجع</button>
                <button onclick="arena.play.flip=!arena.play.flip; render();" class="tap rounded-xl text-xs bg-zinc-900 border border-yellow-500/30 text-yellow-300">🔃 اقلب الرقعة</button>
                <button onclick="playResign()" class="tap rounded-xl text-xs bg-red-500/20 border border-red-500/30 text-red-300">🏳️ استسلام</button>
              </div>` : ''}
            </div>
            <div class="gold-card rounded-2xl p-4">
              <div class="text-xs font-bold text-yellow-400 mb-2">📜 النقلات</div>
              <div dir="ltr" class="text-xs font-mono max-h-56 overflow-y-auto rounded-xl border border-yellow-500/15">${rows || `<div class="p-3 text-center text-gray-500">—</div>`}</div>
            </div>
          </div>
        </div>`;
    }

    // ================= 2) ألغاز على الرقعة (من Lichess) =================
    async function puzLoad() {
      const Z = arena.puz;
      if (!ChessCls || Z.status === "loading") return;
      Z.status = "loading"; Z.sel = null; Z.hint = null; Z.flash = null; arenaRefresh();
      try {
        const url = Z.diff === "daily" ? "https://lichess.org/api/puzzle/daily" : "https://lichess.org/api/puzzle/next?difficulty=" + encodeURIComponent(Z.diff);
        const r = await fetch(url, { headers: { Accept: "application/json" } });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        const g = new ChessCls(); g.loadPgn(j.game.pgn);
        Object.assign(Z, { game: g, sol: j.puzzle.solution || [], idx: 0, color: g.turn(), flip: g.turn() === "b", last: lastOf(g), counted: false, status: "play",
          info: { id: String(j.puzzle.id).replace(/[^A-Za-z0-9]/g, ""), rating: Number(j.puzzle.rating) || 0, themes: (j.puzzle.themes || []).slice(0, 4).map(t => String(t).replace(/[^A-Za-z0-9]/g, "")) } });
      } catch (e) { console.error(e); Z.status = "error"; }
      arenaRefresh();
    }
    function puzCount(solved) {
      const Z = arena.puz; if (Z.counted) return; Z.counted = true;
      recordArena(a => { a.puzTried = (a.puzTried || 0) + 1; if (solved) { a.puzSolved = (a.puzSolved || 0) + 1; a.puzStreak = (a.puzStreak || 0) + 1; a.puzBestStreak = Math.max(a.puzBestStreak || 0, a.puzStreak); } else a.puzStreak = 0; });
    }
    function puzSolved() { const Z = arena.puz; Z.status = "solved"; Z.sel = null; puzCount(true); toast("✅ برافو! اللغز اتحل"); }
    function puzClick(sq) {
      const Z = arena.puz, g = Z.game; if (Z.status !== "play" || !g) return;
      const mv = pickOrMove(Z, sq, Z.color);
      if (!mv) return arenaRefresh();
      const want = Z.sol[Z.idx] || "";
      let r = null; try { r = g.move(mv); } catch (_) {}
      if (!r) return arenaRefresh();
      // الترقية: لو النقلة صح بس الحل بيرقّي لقطعة غير الوزير، نصحّحها
      if (want.length === 5 && r.from + r.to === want.slice(0, 4) && r.promotion !== want[4]) { g.undo(); r = uciMove(g, want); }
      const ok = r.from + r.to + (r.promotion || "") === want || g.isCheckmate();
      Z.last = [r.from, r.to];
      if (!ok) {
        Z.status = "wrong"; Z.flash = { [r.to]: "bad" }; puzCount(false); arenaRefresh();
        setTimeout(() => { if (Z.game !== g) return; g.undo(); Z.flash = null; Z.last = lastOf(g); Z.status = "play"; arenaRefresh(); }, 750);
        return;
      }
      Z.idx++; Z.hint = null; Z.flash = { [r.to]: "good" };
      if (Z.idx >= Z.sol.length || g.isCheckmate()) { puzSolved(); return arenaRefresh(); }
      Z.status = "reply"; arenaRefresh();
      setTimeout(() => {
        if (Z.game !== g) return;
        try { const r2 = uciMove(g, Z.sol[Z.idx]); Z.last = [r2.from, r2.to]; } catch (_) {}
        Z.idx++; Z.flash = null; Z.status = "play";

      }, 550);

    function puzHint() { const Z = arena.puz; if (Z.status !== "play") return; Z.hint = (Z.sol[Z.idx] || "").slice(0, 2); Z.sel = null; puzCount(false); arenaRefresh(); }

      ds.forEach(d => { const t = Date.parse(d + "T12:00:00Z"); run = prev !== null && t - prev === 864e5 ? run + 1 : 1; best = Math.max(best, run); prev = t; });
      const last = ds.length ? Date.parse(ds[ds.length - 1] + "T12:00:00Z") : 0, today = Date.parse(todayISO() + "T12:00:00Z");
      return { best, current: last && today - last <= 864e5 ? run : 0 };
