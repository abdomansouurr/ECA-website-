    /* ===== انتقال ناعم بين الصفحات: انيميشن مختلف لكل قسم — الموقع بيبقى حي ومتنوع ===== */
    /* بتتشتغل من core.js لما التاب يتغير بس (مفيش إعادة تشغيل على نفس الصفحة) وبتقف مع prefers-reduced-motion */
    @keyframes ecaPageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .page-enter { animation: ecaPageIn .22s cubic-bezier(.22,.61,.36,1) both; }
    /* ===== القوائم: أول ما الصفحة تتفتح العناصر بتدخل واحدة ورا التانية بانسيابية =====
       core.js بيعلّم أكبر حايمة قايمة في الصفحة بـ .stagger-in والباقي CSS
       (backwards مش both — عشان أنيميشن الـ hover زي رفع الكروت يفضل شغال بعد الدخول) */
    @keyframes ecaItemIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    .stagger-in > *, .st-item { animation: ecaItemIn .36s cubic-bezier(.22,.61,.36,1) backwards; }
    .stagger-in > *:nth-child(1) { animation-delay: .05s }
    .stagger-in > *:nth-child(2) { animation-delay: .085s }
    .stagger-in > *:nth-child(3) { animation-delay: .12s }
    .stagger-in > *:nth-child(4) { animation-delay: .155s }
    .stagger-in > *:nth-child(5) { animation-delay: .19s }
    .stagger-in > *:nth-child(6) { animation-delay: .225s }
    .stagger-in > *:nth-child(7) { animation-delay: .26s }
    .stagger-in > *:nth-child(8) { animation-delay: .295s }
    .stagger-in > *:nth-child(9) { animation-delay: .33s }
    .stagger-in > *:nth-child(10) { animation-delay: .365s }
    .stagger-in > *:nth-child(11) { animation-delay: .4s }
    .stagger-in > *:nth-child(12) { animation-delay: .435s }
    .stagger-in > *:nth-child(n+13) { animation-delay: .47s }
    /* قايمة الحساب: بتنزل من عند الزر بتكبير ناعم والصفوف بتتوالى */
    @keyframes ecaMenuIn { from { opacity: 0; transform: translateY(-8px) scale(.95); } to { opacity: 1; transform: none; } }
    html[lang="ar"] #acctMenu:not(.hidden) { transform-origin: top left; }
    #acctMenu:not(.hidden) > * { animation: ecaItemIn .3s cubic-bezier(.22,.61,.36,1) backwards; }
    #acctMenu:not(.hidden) > *:nth-child(1) { animation-delay: .03s }
    #acctMenu:not(.hidden) > *:nth-child(2) { animation-delay: .07s }
    #acctMenu:not(.hidden) > *:nth-child(3) { animation-delay: .11s }
    #acctMenu:not(.hidden) > *:nth-child(4) { animation-delay: .15s }
    #acctMenu:not(.hidden) > *:nth-child(n+5) { animation-delay: .19s }
    /* المودالز: الخلفية بتتلاشى جوه والكارت بيدخل من تحت بتكبير ناعم */
    @keyframes ecaBkIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ecaModalIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
    .fixed.inset-0[class*="bg-black"]:not(#sideBackdrop) { animation: ecaBkIn .2s ease backwards; }
    .fixed.inset-0[class*="bg-black"]:not(#sideBackdrop) > * { animation: ecaModalIn .3s cubic-bezier(.22,.9,.3,1) backwards; }
    /* انيميشن فتح/قفل الدرج: الخلفية بتتلاشى والعناصر بتدخل واحدة ورا التانية */
    #sideBackdrop { opacity: 0; transition: opacity .3s ease; }

    #sideNav.open #sideNavItems .nav-tab:nth-child(2) { animation-delay: .06s }

    .eca-promo-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); cursor: pointer; }
    .eca-promo-pc { position: absolute; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center; border: none; padding: 0; margin: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(212,175,55,.55); animation: promoIn .16s ease both; }

    .badge-off { filter: grayscale(1); opacity: .35; }
    details.faq > summary { list-style: none; cursor: pointer; }

    .eca-sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(212,175,55,.45); }
    .eca-sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(255,215,64,.7); }
    .eca-board[data-h] { touch-action: none; user-select: none; -webkit-user-select: none; }

    /* 12. لوحة الشرف: منصة بتطلع، ميدالية بتتمرجح، وأشعة بتلف */
    .gc-rays { left: 50%; top: -14%; width: 130px; height: 130px; margin-left: -65px; border-radius: 50%; background: repeating-conic-gradient(rgba(245,197,24,.45) 0 10deg, transparent 10deg 30deg); -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%); mask-image: radial-gradient(circle, #000 25%, transparent 68%); opacity: .5; }

    /* 13. ألبوم البطاقات: الكروت بتتفتح زي المروحة ولمعة بتعدّي */

    /* 14. قطع جديدة: حصان بينط حرف L وأثره بيترسم */

    /* 17. إطارات: الإطار بيترسم حوالين القطعة وجواهر بتلمع في الأركان */

    /* 18. متجر النجوم: صندوق كنز بيتهز وبيطلع عملات دهب */
    .gc-chest { left: 50%; bottom: 0; width: 80px; height: 70px; margin-left: -40px; }

    /* 19. العب ضد الكمبيوتر: روبوت بيفكّر وبيدق بيتقدم مربع مربع */
    .gc-bot { right: 2%; top: 4%; font-size: 52px; line-height: 1; }

  <script>
    function closeAcctMenu() { var m = document.getElementById("acctMenu"), b = document.getElementById("acctBtn"); if (m) m.classList.add("hidden"); if (b) b.setAttribute("aria-expanded", "false"); }
    function toggleAcctMenu(ev) {
      if (ev) ev.stopPropagation();
      var m = document.getElementById("acctMenu"), b = document.getElementById("acctBtn"); if (!m) return;
      var open = m.classList.contains("hidden");
      m.classList.toggle("hidden", !open);
      if (b) b.setAttribute("aria-expanded", open ? "true" : "false");
    }
    document.addEventListener("click", function (e) { if (!e.target.closest || !e.target.closest("#acctMenu, #acctBtn")) closeAcctMenu(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAcctMenu(); });
    // ===== القائمة الجانبية الرأسية: نفس الزر يفتح ويقفل — عربي يمين / إنجليزي شمال (CSS) =====
    // الخلفية المعتمة بتتلاشى بالتدريج (opacity) بدل ما تظهر وتختفي فجأة
    var __sideBgT = null;
    function openSideNav() {
      var s = document.getElementById("sideNav"), b = document.getElementById("sideBackdrop"), t = document.getElementById("navToggle");
      if (!s) return;
      s.classList.add("open");
      if (b) { clearTimeout(__sideBgT); b.classList.remove("hidden"); requestAnimationFrame(function () { requestAnimationFrame(function () { b.classList.add("show"); }); }); }
      if (t) t.setAttribute("aria-expanded", "true");
    }
    function closeSideNav() {
      var s = document.getElementById("sideNav"), b = document.getElementById("sideBackdrop"), t = document.getElementById("navToggle");
      if (!s) return;
      s.classList.remove("open");
      if (b) { b.classList.remove("show"); clearTimeout(__sideBgT); __sideBgT = setTimeout(function () { b.classList.add("hidden"); }, 340); }
      if (t) t.setAttribute("aria-expanded", "false");
    }
    function toggleSideNav(ev) {
      if (ev) ev.stopPropagation();
      var s = document.getElementById("sideNav"); if (!s) return;
      if (s.classList.contains("open")) closeSideNav(); else openSideNav();
    }
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSideNav(); });
  </script>
